    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/node
    description: One part of a configuration statement, as a set of CPE matches.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - node
    close_mappings:
