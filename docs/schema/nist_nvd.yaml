  NvdCpeReference:
    name: NvdCpeReference
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpeReference
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpe_api_json_2.0.schema#/definitions/defReference
    description: A page about a product, and what kind of page it is.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpe
    aliases:
    - defReference
    slots:
    - NvdCpeReference_type
    - nvdCpeReference__ref
    slot_usage:
      type:
        name: type
        range: NvdCpeReferenceType
    attributes:
      ref:
        name: ref
        description: The page's address.
        comments:
        - NVD's own pattern, with its single quote written as \x27, which means the
          same. gen-python cuts a raw string at a single quote.
        required: true
        pattern: ^([A-Za-z][A-Za-z0-9+.-]+):(\/\/([^@]+@)?([A-Za-z0-9.\-_~]+)(:\d+)?)?((?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@])+(?:\/(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@])*)*|(?:\/(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27()*+,;=:@])+)*)?(\?(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@]|[/?])*)?(\#(?:[A-Za-z0-9-._~]|%[A-Fa-f0-9]|[!$&\x27\[\]()*+,;=:@]|[/?])*)?$
    class_uri: nist_nvd:NvdCpeReference
  NvdCpeNameLink:
    name: NvdCpeNameLink
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpeNameLink
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpe_api_json_2.0.schema#/definitions/defCpe/properties/cpe/properties/deprecatedBy/items
    description: A pointer from one CPE name to another.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpe
    slots:
    - cpeName
    - cpeNameId
    class_uri: nist_nvd:NvdCpeNameLink
  NvdCpeMatchResponse:
    name: NvdCpeMatchResponse
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpeMatchResponse
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpematch_api_json_2.0.schema#
    description: A page of the match-string API's results.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpematch
    close_mappings:
    - schema:DataFeed
    mixins:
    - NvdResponseMixin
    slots:
    - nvdCpeMatchResponse__matchStrings
    - NvdCpeMatchResponse_format
    - NvdResponseMixin_timestamp
    - nvdResponseMixin__resultsPerPage
    - nvdResponseMixin__startIndex
    - nvdResponseMixin__totalResults
    - nvdResponseMixin__version
    slot_usage:
      format:
        name: format
        equals_string: NVD_CPEMatchString
    attributes:
      matchStrings:
        name: matchStrings
        description: The match strings on this page.
        range: NvdMatchStringItem
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdCpeMatchResponse
    tree_root: true
  NvdMatchStringItem:
    name: NvdMatchStringItem
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdMatchStringItem
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpematch_api_json_2.0.schema#/definitions/def_matchstring
    description: One entry of a match-string response, which only wraps the match
      string.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpematch
    aliases:
    - def_matchstring
    close_mappings:
    - schema:DataFeedItem
    slots:
    - nvdMatchStringItem__matchString
    attributes:
      matchString:
        name: matchString
        description: The match string and what NVD holds about it.
        range: NvdMatchString
        required: true
        inlined: true
    class_uri: nist_nvd:NvdMatchStringItem
  NvdMatchString:
    name: NvdMatchString
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdMatchString
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpematch_api_json_2.0.schema#/definitions/def_match_data
    description: A CPE match string or range as NVD holds it, and the CPE names it
      matches.
    notes:
    - The identifier is set on this class alone, because matchCriteriaId also appears
      in a vulnerability's configurations, where the same match string can recur with
      a different vulnerable flag. So it identifies a match string here and not a
      use of one there.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpematch
    aliases:
    - def_match_data
    slots:
    - criteria
    - NvdMatchString_matchCriteriaId
    - versionStartExcluding
    - versionStartIncluding
    - versionEndExcluding
    - versionEndIncluding
    - NvdMatchString_created
    - NvdMatchString_lastModified
    - NvdMatchString_status
    - nvdMatchString__cpeLastModified
    - nvdMatchString__matches
    slot_usage:
      matchCriteriaId:
        name: matchCriteriaId
        identifier: true
      created:
        name: created
        required: true
      lastModified:
        name: lastModified
        required: true
      status:
        name: status
        range: NvdMatchStringStatus
        required: true
    attributes:
      cpeLastModified:
        name: cpeLastModified
        description: When NVD last changed the list of CPE names this matches.
        range: nvd_timestamp
      matches:
        name: matches
        description: The CPE names this matches.
        range: NvdMatchedCpe
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdMatchString
  NvdMatchedCpe:
    name: NvdMatchedCpe
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdMatchedCpe
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpematch_api_json_2.0.schema#/definitions/def_cpe_name
    description: A CPE name that a match string matches.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpematch
    aliases:
    - def_cpe_name
    slots:
    - NvdMatchedCpe_cpeName
    - NvdMatchedCpe_cpeNameId
    slot_usage:
      cpeName:
        name: cpeName
        required: true
      cpeNameId:
        name: cpeNameId
        required: true
    class_uri: nist_nvd:NvdMatchedCpe
  NvdHistoryResponse:
    name: NvdHistoryResponse
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdHistoryResponse
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_history_api_json_2.0.schema#
    description: A page of the change-history API's results.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_history
    close_mappings:
    - schema:DataFeed
    mixins:
    - NvdResponseMixin
    slots:
    - nvdHistoryResponse__cveChanges
    - NvdHistoryResponse_format
    - NvdResponseMixin_timestamp
    - nvdResponseMixin__resultsPerPage
    - nvdResponseMixin__startIndex
    - nvdResponseMixin__totalResults
    - nvdResponseMixin__version
    slot_usage:
      format:
        name: format
        equals_string: NVD_CVEHistory
    attributes:
      cveChanges:
        name: cveChanges
        description: The changes on this page.
        range: NvdChangeItem
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdHistoryResponse
    tree_root: true
  NvdChangeItem:
    name: NvdChangeItem
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdChangeItem
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_history_api_json_2.0.schema#/definitions/defChange
    description: One entry of a change-history response, which only wraps the change.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_history
    aliases:
    - defChange
    close_mappings:
    - schema:DataFeedItem
    slots:
    - nvdChangeItem__change
    attributes:
      change:
        name: change
        description: The change.
        range: NvdChange
        required: true
        inlined: true
    class_uri: nist_nvd:NvdChangeItem
  NvdChange:
    name: NvdChange
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdChange
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_history_api_json_2.0.schema#/definitions/changeItem
    description: One change to a vulnerability's record at NVD.
    notes:
    - The identifier is set on this class and not on the slot, so that lokf adapt
      keeps the key beside LOKF's id, as it does for cpeNameId and matchCriteriaId.
    comments:
    - A change is something that happened to a record, so it relates to a PROV activity,
      but NVD records only when and by whom, not the entities it used.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_history
    aliases:
    - changeItem
    related_mappings:
    - prov:Activity
    slots:
    - NvdChange_cveChangeId
    - NvdChange_sourceIdentifier
    - created
    - nvdChange__cveId
    - nvdChange__eventName
    - nvdChange__details
    slot_usage:
      cveChangeId:
        name: cveChangeId
        identifier: true
      sourceIdentifier:
        name: sourceIdentifier
        required: true
    attributes:
      cveId:
        name: cveId
        description: The vulnerability the change is to.
        range: NvdCve
        required: true
        pattern: ^CVE-[0-9]{4}-[0-9]{4,}$
      eventName:
        name: eventName
        description: The kind of event, such as Initial Analysis or CVE Modified.
        comments:
        - NVD's schema says only that this is a string. The samples read here hold
          too little of a list of 2.4 million changes to close it, so it stays a string.
        required: true
      details:
        name: details
        description: What the change did, part by part.
        range: NvdChangeDetail
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdChange
  NvdChangeDetail:
    name: NvdChangeDetail
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdChangeDetail
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_history_api_json_2.0.schema#/definitions/detail
    description: One part of a change, naming what kind of data changed and how.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_history
    aliases:
    - detail
    slots:
    - NvdChangeDetail_type
    - nvdChangeDetail__action
    - nvdChangeDetail__oldValue
    - nvdChangeDetail__newValue
    slot_usage:
      type:
        name: type
        comments:
        - NVD's schema says only that this is a string, such as CWE or CVSS V3.1.
          It stays a string for the reason eventName does.
        required: true
    attributes:
      action:
        name: action
        description: How the data changed, such as Added.
      oldValue:
        name: oldValue
        description: The value before the change.
        any_of:
        - range: string
        - range: string
          multivalued: true
        - range: NvdChangeObject
      newValue:
        name: newValue
        description: The value after the change.
        any_of:
        - range: string
        - range: string
          multivalued: true
        - range: NvdChangeObject
    class_uri: nist_nvd:NvdChangeDetail
  NvdChangeObject:
    name: NvdChangeObject
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdChangeObject
    description: A value before or after a change that is an object, with any keys.
    comments:
    - NVD's file allows a string, an array or an object as a value, and states nothing
      of the object's keys. The 1,335 values of the three pages read on 2026-11-03
      are all strings, so no key is named here, and LinkML's Pydantic generator, which
      ignores extra_slots, would refuse an object.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_history
    class_uri: nist_nvd:NvdChangeObject
    extra_slots:
      allowed: true
  CvssSeverityBandsMixin:
    name: CvssSeverityBandsMixin
    definition_uri: https://w3id.org/lmodel/cve/CvssSeverityBandsMixin
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/anyOf imports/cvss/cvss-v3.1.json#/anyOf
          imports/cvss/cvss-v4.0.json#/allOf/0/anyOf
    description: The base score and base severity of a CVSS version with severity
      bands, and the bands that tie one to the other.
    comments:
    - The upstream also rules out a score that is not a multiple of 0.1, as a list
      of numbers no LinkML range can state. tests/cve_rules.py checks that.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    mixin: true
    slots:
    - baseScore
    - baseSeverity
    class_uri: cve:CvssSeverityBandsMixin
    rules:
    - preconditions:
        slot_conditions:
          baseSeverity:
            name: baseSeverity
            equals_string: NONE
      postconditions:
        slot_conditions:
          baseScore:
            name: baseScore
            minimum_value: 0
            maximum_value: 0
      description: A base severity of NONE goes with a base score of exactly 0.
      title: base severity NONE
    - preconditions:
        slot_conditions:
          baseSeverity:
            name: baseSeverity
            equals_string: LOW
      postconditions:
        slot_conditions:
          baseScore:
            name: baseScore
            minimum_value: 0.1
            maximum_value: 3.9
      description: A base severity of LOW goes with a base score from 0.1 to 3.9.
      title: base severity LOW
    - preconditions:
        slot_conditions:
          baseSeverity:
            name: baseSeverity
            equals_string: MEDIUM
      postconditions:
        slot_conditions:
          baseScore:
            name: baseScore
            minimum_value: 4.0
            maximum_value: 6.9
      description: A base severity of MEDIUM goes with a base score from 4.0 to 6.9.
      title: base severity MEDIUM
    - preconditions:
        slot_conditions:
          baseSeverity:
            name: baseSeverity
            equals_string: HIGH
      postconditions:
        slot_conditions:
          baseScore:
            name: baseScore
            minimum_value: 7.0
            maximum_value: 8.9
      description: A base severity of HIGH goes with a base score from 7.0 to 8.9.
      title: base severity HIGH
    - preconditions:
        slot_conditions:
          baseSeverity:
            name: baseSeverity
            equals_string: CRITICAL
      postconditions:
        slot_conditions:
          baseScore:
            name: baseScore
            minimum_value: 9.0
            maximum_value: 10.0
      description: A base severity of CRITICAL goes with a base score from 9.0 to
        10.
      title: base severity CRITICAL
  CvssV20:
    name: CvssV20
    definition_uri: https://w3id.org/lmodel/cve/CvssV20
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/
    description: A score under CVSS version 2.0, which has no severity bands.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:CVSS2BaseMetric
    related_mappings:
    - spdx_security:CvssV2VulnAssessmentRelationship
    slots:
    - CvssV20_version
    - CvssV20_vectorString
    - baseScore
    - CvssV20_confidentialityImpact
    - CvssV20_integrityImpact
    - CvssV20_availabilityImpact
    - CvssV20_remediationLevel
    - CvssV20_reportConfidence
    - temporalScore
    - CvssV20_confidentialityRequirement
    - CvssV20_integrityRequirement
    - CvssV20_availabilityRequirement
    - environmentalScore
    - cvssV20__accessVector
    - cvssV20__accessComplexity
    - cvssV20__authentication
    - cvssV20__exploitability
    - cvssV20__collateralDamagePotential
    - cvssV20__targetDistribution
    slot_usage:
      version:
        name: version
        required: true
        equals_string: '2.0'
      vectorString:
        name: vectorString
        pattern: ^((AV:[NAL]|AC:[LMH]|Au:[MSN]|[CIA]:[NPC]|E:(U|POC|F|H|ND)|RL:(OF|TF|W|U|ND)|RC:(UC|UR|C|ND)|CDP:(N|L|LM|MH|H|ND)|TD:(N|L|M|H|ND)|[CIA]R:(L|M|H|ND))/)*(AV:[NAL]|AC:[LMH]|Au:[MSN]|[CIA]:[NPC]|E:(U|POC|F|H|ND)|RL:(OF|TF|W|U|ND)|RC:(UC|UR|C|ND)|CDP:(N|L|LM|MH|H|ND)|TD:(N|L|M|H|ND)|[CIA]R:(L|M|H|ND))$
      confidentialityImpact:
        name: confidentialityImpact
        range: CvssV2Impact
      integrityImpact:
        name: integrityImpact
        range: CvssV2Impact
      availabilityImpact:
        name: availabilityImpact
        range: CvssV2Impact
      remediationLevel:
        name: remediationLevel
        range: CvssRemediationLevel
      reportConfidence:
        name: reportConfidence
        range: CvssV2ReportConfidence
      confidentialityRequirement:
        name: confidentialityRequirement
        range: CvssRequirement
      integrityRequirement:
        name: integrityRequirement
        range: CvssRequirement
      availabilityRequirement:
        name: availabilityRequirement
        range: CvssRequirement
    attributes:
      accessVector:
        name: accessVector
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v2.0.json#/properties/accessVector
        description: How far away an attacker can be when using the flaw, in CVSS
          2.0's terms.
        close_mappings:
        - sepses_cvss:accessVector
        range: CvssV2AccessVector
      accessComplexity:
        name: accessComplexity
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v2.0.json#/properties/accessComplexity
        description: How hard the flaw is to use once the attacker can reach it.
        close_mappings:
        - sepses_cvss:accessComplexity
        range: CvssV2AccessComplexity
      authentication:
        name: authentication
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v2.0.json#/properties/authentication
        description: How many times an attacker must log in before using the flaw.
        close_mappings:
        - sepses_cvss:authentication
        range: CvssV2Authentication
      exploitability:
        name: exploitability
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v2.0.json#/properties/exploitability
        description: How far working attack code has come, in CVSS 2.0's terms.
        range: CvssExploitCodeMaturity
      collateralDamagePotential:
        name: collateralDamagePotential
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v2.0.json#/properties/collateralDamagePotential
        description: How much loss a successful attack could cause beyond the system
          itself.
        range: CvssV2CollateralDamagePotential
      targetDistribution:
        name: targetDistribution
        annotations:
          upstream_path:
            tag: upstream_path
            value: imports/cvss/cvss-v2.0.json#/properties/targetDistribution
        description: How much of the scorer's environment is exposed to the flaw.
        range: CvssV2TargetDistribution
    class_uri: cve:CvssV20
  CvssV30:
    name: CvssV30
    definition_uri: https://w3id.org/lmodel/cve/CvssV30
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/
    description: A score under CVSS version 3.0.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    close_mappings:
    - sepses_cvss:CVSS3BaseMetric
    related_mappings:
