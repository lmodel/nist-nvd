        description: Attacks have been reported, or tools for them are public.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value, so the worst case is assumed.
  CvssV4Safety:
    name: CvssV4Safety
    definition_uri: https://w3id.org/lmodel/cve/CvssV4Safety
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/safetyType
    description: Whether an attack could put people's safety at risk.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      NEGLIGIBLE:
        text: NEGLIGIBLE
        description: Any harm to people would be slight at most.
      PRESENT:
        text: PRESENT
        description: People could be seriously hurt.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4Automatable:
    name: CvssV4Automatable
    definition_uri: https://w3id.org/lmodel/cve/CvssV4Automatable
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/automatableType
    description: Whether every step of an attack could be automated across many targets.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      'NO':
        text: 'NO'
        description: At least one step resists automation.
      'YES':
        text: 'YES'
        description: Every step can be automated.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4Recovery:
    name: CvssV4Recovery
    definition_uri: https://w3id.org/lmodel/cve/CvssV4Recovery
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/recoveryType
    description: How the affected system comes back after an attack.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      AUTOMATIC:
        text: AUTOMATIC
        description: The system recovers by itself.
      USER:
        text: USER
        description: Someone has to step in and restore it.
      IRRECOVERABLE:
        text: IRRECOVERABLE
        description: The system cannot be restored.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4ValueDensity:
    name: CvssV4ValueDensity
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ValueDensity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/valueDensityType
    description: How much of a resource one successful attack gains the attacker.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      DIFFUSE:
        text: DIFFUSE
        description: Each target holds little, so an attacker must take many.
      CONCENTRATED:
        text: CONCENTRATED
        description: A single target holds a lot.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4ResponseEffort:
    name: CvssV4ResponseEffort
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ResponseEffort
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/vulnerabilityResponseEffortType
    description: How much work it takes a consumer to respond to the flaw.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      LOW:
        text: LOW
        description: Little work, such as reading advice or a small configuration
          change.
      MODERATE:
        text: MODERATE
        description: Some work, with a noticeable effect on the service.
      HIGH:
        text: HIGH
        description: Much work, or a long outage.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
  CvssV4ProviderUrgency:
    name: CvssV4ProviderUrgency
    definition_uri: https://w3id.org/lmodel/cve/CvssV4ProviderUrgency
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/definitions/providerUrgencyType
    description: How urgent the product's supplier says the flaw is, as a colour.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      CLEAR:
        text: CLEAR
        description: The supplier sees little or no urgency.
      GREEN:
        text: GREEN
        description: The supplier says the flaw can wait for regular work.
      AMBER:
        text: AMBER
        description: The supplier says the flaw matters soon.
      RED:
        text: RED
        description: The supplier says the flaw is at the highest urgency.
      NOT_DEFINED:
        text: NOT_DEFINED
        description: The scorer gave no value.
slots:
  format:
    name: format
    definition_uri: https://w3id.org/lmodel/nist-nvd/format
    description: The name NVD gives this kind of response.
    comments:
    - NVD's schemas say only that this is a string. Each response class pins the one
      value the API's answers carry.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:format
    slot_uri: nist_nvd:format
    owner: NvdResponseMixin
    domain_of:
    - NvdResponseMixin
    range: string
    required: true
  timestamp:
    name: timestamp
    definition_uri: https://w3id.org/lmodel/nist-nvd/timestamp
    description: When NVD produced this response or this decision.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:timestamp
    close_mappings:
    - schema:dateCreated
    slot_uri: nist_nvd:timestamp
    owner: NvdSsvcData
    domain_of:
    - NvdResponseMixin
    - NvdSsvcData
    range: nvd_timestamp
  created:
    name: created
    definition_uri: https://w3id.org/lmodel/nist-nvd/created
    description: When NVD first recorded this.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:created
    close_mappings:
    - dcterms:created
    slot_uri: nist_nvd:created
    owner: NvdChange
    domain_of:
    - NvdCpe
    - NvdMatchString
    - NvdChange
    range: nvd_timestamp
  lastModified:
    name: lastModified
    definition_uri: https://w3id.org/lmodel/nist-nvd/lastModified
    description: When NVD last changed this.
    comments:
    - 'On a vulnerability this is NVD''s own time, not the CVE record''s dateUpdated:
      the two are set by different parties and often differ, so the mapping to it
      is only a related one.'
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:lastModified
    close_mappings:
    - dcterms:modified
    - schema:dateModified
    - spdx3:Security/modifiedTime
    related_mappings:
    - cve:dateUpdated
    slot_uri: nist_nvd:lastModified
    owner: NvdMatchString
    domain_of:
    - NvdCve
    - NvdVendorComment
    - NvdCpe
    - NvdMatchString
    range: nvd_timestamp
  sourceIdentifier:
    name: sourceIdentifier
    definition_uri: https://w3id.org/lmodel/nist-nvd/sourceIdentifier
    description: The email address or UUID of the organization that supplied this.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:sourceIdentifier
    slot_uri: nist_nvd:sourceIdentifier
    owner: NvdChange
    domain_of:
    - NvdCve
    - NvdCveTag
    - NvdChange
    range: string
  source:
    name: source
    definition_uri: https://w3id.org/lmodel/nist-nvd/source
    description: The email address or UUID of the organization that supplied this.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:source
    slot_uri: nist_nvd:source
    owner: NvdWeakness
    domain_of:
    - NvdReference
    - NvdCvssMetricV2
    - NvdCvssMetricV30
    - NvdCvssMetricV31
    - NvdCvssMetricV40
    - NvdSsvcMetricV203
    - NvdAffected
    - NvdWeakness
    range: string
  type:
    name: type
    definition_uri: https://w3id.org/lmodel/nist-nvd/type
    description: The kind of this thing, from the list its class names.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mappings:
    - nist_nvd:type
    slot_uri: nist_nvd:type
    owner: NvdChangeDetail
    domain_of:
    - NvdCvssMetricV2
    - NvdCvssMetricV30
    - NvdCvssMetricV31
    - NvdCvssMetricV40
    - NvdWeakness
    - NvdCpeReference
    - NvdChangeDetail
    range: string
  status:
    name: status
    definition_uri: https://w3id.org/lmodel/nist-nvd/status
    description: The state of this thing, from the list its class names.
