    description: The affected parts of the product.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    close_mappings:
    - cve:modules
    slot_uri: nist_nvd:modules
    list_elements_unique: true
    alias: modules
    owner: NvdAffectedProduct
    domain_of:
    - NvdAffectedProduct
    range: string
    multivalued: true
    pattern: ^[\s\S]{1,4096}$
  nvdAffectedProduct__programFiles:
    name: nvdAffectedProduct__programFiles
    description: The affected source code files.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
