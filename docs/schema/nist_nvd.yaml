    definition_uri: https://w3id.org/lmodel/nist-nvd/tags
    description: Labels on this thing, from the list its class names.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    mappings:
    - nist_nvd:tags
    slot_uri: nist_nvd:tags
    owner: NvdReference
    domain_of:
    - NvdCveTag
    - NvdReference
    range: string
    multivalued: true
  url:
    name: url
