    - CvssV40_privilegesRequired
    - CvssV40_userInteraction
    - CvssV40_confidentialityRequirement
    - CvssV40_integrityRequirement
    - CvssV40_availabilityRequirement
    - CvssV40_modifiedAttackVector
    - CvssV40_modifiedAttackComplexity
    - CvssV40_modifiedPrivilegesRequired
    - CvssV40_modifiedUserInteraction
