    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpeTitle
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpe_api_json_2.0.schema#/definitions/defTitle
    description: A product's title in one language.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpe
    aliases:
