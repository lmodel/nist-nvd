    - CvssV30_attackComplexity
    - CvssV30_privilegesRequired
    - CvssV30_userInteraction
    - scope
    - CvssV30_confidentialityImpact
    - CvssV30_integrityImpact
    - CvssV30_availabilityImpact
    - exploitCodeMaturity
    - CvssV30_remediationLevel
    - CvssV30_reportConfidence
    - temporalScore
    - temporalSeverity
    - CvssV30_confidentialityRequirement
    - CvssV30_integrityRequirement
    - CvssV30_availabilityRequirement
    - CvssV30_modifiedAttackVector
    - CvssV30_modifiedAttackComplexity
    - CvssV30_modifiedPrivilegesRequired
    - CvssV30_modifiedUserInteraction
    - modifiedScope
    - CvssV30_modifiedConfidentialityImpact
    - CvssV30_modifiedIntegrityImpact
    - CvssV30_modifiedAvailabilityImpact
    - environmentalScore
