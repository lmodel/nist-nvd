name: nist-nvd
annotations:
  source_context:
    tag: source_context
    value: NVD Vulnerability Detail Pages and Vulnerability Status pages
  source_features:
    tag: source_features
    value: current_description,analysis_description,cvss_tabs,reference_resource_tags,cpe_configuration_types,kev_banner,weakness_source_table,status_flow
  cwe_view:
    tag: cwe_view
    value: CWE-1003
description: 'NIST National Vulnerability Database (NVD) LinkML Schema.

  Captures enriched vulnerability records, CVSS metric views, CPE

  applicability statements, weakness attributions, reference resource tags,

  KEV indicator details, and NVD lifecycle status transitions.'
title: nist-nvd
source: https://nvd.nist.gov/vuln/data-feeds
see_also:
- https://lmodel.github.io/nist-nvd
- https://csrc.nist.gov/schema/nvd/api/2.0/cve_api_json_2.0.schema
- https://nvd.nist.gov/vuln/detail
- https://nvd.nist.gov/general/visualizations/vulnerability-visualizations/cve-status-waterfall
id: https://w3id.org/lmodel/nist-nvd
imports:
- ./vulnerability_core
- linkml:types
license: Apache-2.0
prefixes:
  nvd:
    prefix_prefix: nvd
    prefix_reference: https://w3id.org/lmodel/nist-nvd/
  core:
    prefix_prefix: core
    prefix_reference: https://w3id.org/lmodel/vulnerability-core/
  cve:
    prefix_prefix: cve
    prefix_reference: https://w3id.org/lmodel/cve/
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  schema:
    prefix_prefix: schema
    prefix_reference: http://schema.org/
  dct:
    prefix_prefix: dct
    prefix_reference: http://purl.org/dc/terms/
  skos:
    prefix_prefix: skos
    prefix_reference: http://www.w3.org/2004/02/skos/core#
  xsd:
    prefix_prefix: xsd
    prefix_reference: http://www.w3.org/2001/XMLSchema#
  WIKIDATA:
    prefix_prefix: WIKIDATA
    prefix_reference: https://www.wikidata.org/wiki/
default_prefix: nvd
default_range: string
subsets:
  nvd_feed:
    name: nvd_feed
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdFeed
    description: Fields published in NVD API and feeds.
    from_schema: https://w3id.org/lmodel/nist-nvd
  metrics:
    name: metrics
    definition_uri: https://w3id.org/lmodel/nist-nvd/Metrics
    description: CVSS and related scoring content.
    from_schema: https://w3id.org/lmodel/nist-nvd
  detail_page:
    name: detail_page
    definition_uri: https://w3id.org/lmodel/nist-nvd/DetailPage
    description: Fields represented on NVD vulnerability detail pages.
    from_schema: https://w3id.org/lmodel/nist-nvd
  status_workflow:
    name: status_workflow
    definition_uri: https://w3id.org/lmodel/nist-nvd/StatusWorkflow
    description: Fields representing NVD status lifecycle and transition context.
    from_schema: https://w3id.org/lmodel/nist-nvd
  core:
    name: core
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Core
    description: Cross-program vulnerability metadata
    from_schema: https://w3id.org/lmodel/vulnerability-core
  metadata:
    name: metadata
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Metadata
    description: Identification and reference fields
    from_schema: https://w3id.org/lmodel/vulnerability-core
types:
  CveId:
    name: CveId
    definition_uri: https://w3id.org/lmodel/vulnerability-core/CveId
    description: 'A CVE identifier assigned by a CVE Numbering Authority (CNA). Format:
      CVE-YYYY-NNNNN.'
    from_schema: https://w3id.org/lmodel/vulnerability-core
    exact_mappings:
    - cwe:CveId
    base: str
    uri: xsd:string
    pattern: ^CVE-[0-9]{4}-[0-9]+$
  IsoDate:
    name: IsoDate
    definition_uri: https://w3id.org/lmodel/vulnerability-core/IsoDate
    description: A calendar date in ISO 8601 format (YYYY-MM-DD).
    from_schema: https://w3id.org/lmodel/vulnerability-core
    base: str
    uri: xsd:date
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string.   If you are authoring schemas in LinkML YAML, the type is
      referenced with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  CVSSVersion:
    name: CVSSVersion
    definition_uri: https://w3id.org/lmodel/nist-nvd/CVSSVersion
    description: Supported CVSS versions displayed in NVD metrics tabs.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      V2_0:
        text: V2_0
      V3_0:
        text: V3_0
      V3_1:
        text: V3_1
      V4_0:
        text: V4_0
  NVDTag:
    name: NVDTag
    definition_uri: https://w3id.org/lmodel/nist-nvd/NVDTag
    description: NVD analysis tags attached to vulnerability records.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      ANALYSIS_PENDING:
        text: ANALYSIS_PENDING
      ADDITIONAL_INFORMATION:
        text: ADDITIONAL_INFORMATION
  ScoreSource:
    name: ScoreSource
    definition_uri: https://w3id.org/lmodel/nist-nvd/ScoreSource
    description: Provider of CVSS vectors and scores.
    from_schema: https://w3id.org/lmodel/nist-nvd
    related_mappings:
    - cve:ProviderMetadata
    permissible_values:
      NVD:
        text: NVD
      CNA:
        text: CNA
      ADP:
        text: ADP
      VENDOR:
        text: VENDOR
      THIRD_PARTY:
        text: THIRD_PARTY
  ReferenceTag:
    name: ReferenceTag
    definition_uri: https://w3id.org/lmodel/nist-nvd/ReferenceTag
    description: Resource tag labels used by NVD references.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      THIRD_PARTY_ADVISORY:
        text: THIRD_PARTY_ADVISORY
      VENDOR_ADVISORY:
        text: VENDOR_ADVISORY
      ISSUE_TRACKING:
        text: ISSUE_TRACKING
      PATCH:
        text: PATCH
      TECHNICAL_DESCRIPTION:
        text: TECHNICAL_DESCRIPTION
      PRESS_MEDIA_COVERAGE:
        text: PRESS_MEDIA_COVERAGE
      VDB_ENTRY:
        text: VDB_ENTRY
  ConfigurationType:
    name: ConfigurationType
    definition_uri: https://w3id.org/lmodel/nist-nvd/ConfigurationType
    description: NVD configuration rendering category.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      BASIC:
        text: BASIC
      RUNNING_ON_WITH:
        text: RUNNING_ON_WITH
      ADVANCED:
        text: ADVANCED
  NVDWorkflowStatus:
    name: NVDWorkflowStatus
    definition_uri: https://w3id.org/lmodel/nist-nvd/NVDWorkflowStatus
    description: Enrichment state labels shown by NVD for CVEs.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      AWAITING_ENRICHMENT:
        text: AWAITING_ENRICHMENT
      UNDERGOING_ENRICHMENT:
        text: UNDERGOING_ENRICHMENT
      ENRICHED:
        text: ENRICHED
      MODIFIED_AFTER_ENRICHMENT:
        text: MODIFIED_AFTER_ENRICHMENT
      NOT_SCHEDULED:
        text: NOT_SCHEDULED
      REJECTED:
        text: REJECTED
  NVDWorkflowEventSource:
    name: NVDWorkflowEventSource
    definition_uri: https://w3id.org/lmodel/nist-nvd/NVDWorkflowEventSource
    description: Source of state transition decisions in the status flow.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      NVD_PROCESS:
        text: NVD_PROCESS
      NVD_STAFF_DECISION:
        text: NVD_STAFF_DECISION
      CVE_PROGRAM_PROCESS:
        text: CVE_PROGRAM_PROCESS
      USER_REQUEST:
        text: USER_REQUEST
  VersionBoundType:
    name: VersionBoundType
    definition_uri: https://w3id.org/lmodel/nist-nvd/VersionBoundType
    description: Boundary type for version-range constraints.
    from_schema: https://w3id.org/lmodel/nist-nvd
    permissible_values:
      START_INCLUDING:
        text: START_INCLUDING
      START_EXCLUDING:
        text: START_EXCLUDING
      END_INCLUDING:
        text: END_INCLUDING
      END_EXCLUDING:
        text: END_EXCLUDING
  VulnerabilityStatus:
    name: VulnerabilityStatus
    definition_uri: https://w3id.org/lmodel/vulnerability-core/VulnerabilityStatus
    description: Lifecycle state of a vulnerability record.
    from_schema: https://w3id.org/lmodel/vulnerability-core
    permissible_values:
      ACTIVE:
        text: ACTIVE
        description: Vulnerability is actively maintained and published.
      REJECTED:
        text: REJECTED
        description: CVE ID was rejected and should not be used.
      DISPUTED:
        text: DISPUTED
        description: The vulnerability details are disputed by a party.
      RESERVED:
        text: RESERVED
        description: CVE ID is reserved but details are not yet published.
      DEPRECATED:
        text: DEPRECATED
        description: Entry has been superseded or withdrawn.
  ImpactSeverity:
    name: ImpactSeverity
    definition_uri: https://w3id.org/lmodel/vulnerability-core/ImpactSeverity
    description: CVSS qualitative severity rating.
    from_schema: https://w3id.org/lmodel/vulnerability-core
    permissible_values:
      NONE:
        text: NONE
        description: No measurable impact.
      LOW:
        text: LOW
        description: Limited impact; exploitation requires specific conditions.
      MEDIUM:
        text: MEDIUM
        description: Moderate impact; partial compromise of security properties.
      HIGH:
        text: HIGH
        description: High impact; significant compromise of security properties.
      CRITICAL:
        text: CRITICAL
        description: Critical impact; complete compromise; remote exploitation likely.
      UNKNOWN:
        text: UNKNOWN
        description: Severity has not been assessed or is unavailable.
slots:
  description_source:
    name: description_source
    definition_uri: https://w3id.org/lmodel/nist-nvd/description_source
    description: Source attribution shown beneath Current Description.
    examples:
    - value: MITRE
    from_schema: https://w3id.org/lmodel/nist-nvd
    mappings:
    - dct:source
    slot_uri: dct:source
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: string
  analysis_description:
    name: analysis_description
    definition_uri: https://w3id.org/lmodel/nist-nvd/analysis_description
    description: Description available at enrichment time and shown under Analysis
      Description.
    from_schema: https://w3id.org/lmodel/nist-nvd
    mappings:
    - dct:description
    slot_uri: dct:description
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: string
  metrics:
    name: metrics
    definition_uri: https://w3id.org/lmodel/nist-nvd/metrics
    description: Grouped CVSS displays and notes for this entry.
    in_subset:
    - metrics
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:metrics
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: MetricSet
    inlined: true
    inlined_as_list: true
  configurations:
    name: configurations
    definition_uri: https://w3id.org/lmodel/nist-nvd/configurations
    description: Affected software configuration statements.
    in_subset:
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:configurations
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: CPEConfiguration
    multivalued: true
    inlined: true
    inlined_as_list: true
  workflow_status:
    name: workflow_status
    definition_uri: https://w3id.org/lmodel/nist-nvd/workflow_status
    description: Current NVD workflow status for the CVE.
    from_schema: https://w3id.org/lmodel/nist-nvd
    exact_mappings:
    - skos:notation
    slot_uri: nvd:workflow_status
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: NVDWorkflowStatus
  status_transitions:
    name: status_transitions
    definition_uri: https://w3id.org/lmodel/nist-nvd/status_transitions
    description: Timeline of status transitions in NVD workflow.
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:status_transitions
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: StatusTransition
    multivalued: true
    inlined: true
    inlined_as_list: true
  known_exploited:
    name: known_exploited
    definition_uri: https://w3id.org/lmodel/nist-nvd/known_exploited
    description: KEV banner details when this CVE is listed by CISA.
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:known_exploited
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: KnownExploitedVulnerability
    inlined: true
    inlined_as_list: true
  cve_tags:
    name: cve_tags
    definition_uri: https://w3id.org/lmodel/nist-nvd/cve_tags
    description: CVE tags passed through the CVE List and rendered by NVD.
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:cve_tags
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: string
    multivalued: true
  cwe_view:
    name: cwe_view
    definition_uri: https://w3id.org/lmodel/nist-nvd/cwe_view
    description: CWE view used for weakness mapping, typically CWE-1003.
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:cwe_view
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: string
  date_received:
    name: date_received
    definition_uri: https://w3id.org/lmodel/nist-nvd/date_received
    description: Date/time when NVD received the CVE record for processing.
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:date_received
    owner: NVDEntry
    domain_of:
    - NVDEntry
    range: datetime
  cvss_v4_metrics:
    name: cvss_v4_metrics
    definition_uri: https://w3id.org/lmodel/nist-nvd/cvss_v4_metrics
    description: CVSS v4.0 metrics.
    from_schema: https://w3id.org/lmodel/nist-nvd
    slot_uri: nvd:cvss_v4_metrics
    owner: MetricSet
    domain_of:
    - MetricSet
    range: CVSSMetric
    multivalued: true
    inlined: true
