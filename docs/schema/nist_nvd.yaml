        range: NvdCpeNameLink
        multivalued: true
        inlined: true
        inlined_as_list: true
      deprecates:
        name: deprecates
        description: The CPE names this one replaces.
        close_mappings:
        - dcterms:replaces
        range: NvdCpeNameLink
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdCpe
  NvdCpeTitle:
