  CvssV40:
    name: CvssV40
    definition_uri: https://w3id.org/lmodel/cve/CvssV40
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v4.0.json#/
    description: A score under CVSS version 4.0.
    comments:
    - The upstream's rules name threatScore, threatSeverity, environmentalScore and
      environmentalSeverity, but its list of properties has none of them and it refuses
      any other key, so a score object cannot carry them and this class has no such
      slots.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    related_mappings:
    - spdx_security:CvssV4VulnAssessmentRelationship
    broad_mappings:
    - sepses_cvss:CVSS
