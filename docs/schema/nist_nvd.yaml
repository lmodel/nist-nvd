  NvdCpe:
    name: NvdCpe
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpe
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cpe_api_json_2.0.schema#/definitions/defCpe/properties/cpe
    description: A CPE name as NVD holds it, with its UUID.
    notes:
    - The identifier is set on this class alone, because cpeNameId also appears where
      one CPE name points to another. lokf adapt replaces a slot that is an identifier
      with LOKF's id everywhere, which would rename those keys too.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpe
    close_mappings:
    - sepses_cpe:CPE
    slots:
    - NvdCpe_cpeName
    - NvdCpe_cpeNameId
    - NvdCpe_created
    - NvdCpe_lastModified
    - nvdCpe__deprecated
    - nvdCpe__titles
    - nvdCpe__refs
    - nvdCpe__deprecatedBy
    - nvdCpe__deprecates
    slot_usage:
      cpeName:
        name: cpeName
        required: true
      cpeNameId:
        name: cpeNameId
        identifier: true
      created:
        name: created
        required: true
      lastModified:
        name: lastModified
        required: true
    attributes:
      deprecated:
        name: deprecated
        description: Whether NVD has retired this CPE name.
        range: boolean
        required: true
      titles:
        name: titles
        description: The product's titles, in one or more languages.
        range: NvdCpeTitle
        multivalued: true
        inlined: true
        inlined_as_list: true
      refs:
        name: refs
        description: Pages about the product.
        close_mappings:
        - dcterms:references
        range: NvdCpeReference
        multivalued: true
        inlined: true
        inlined_as_list: true
      deprecatedBy:
