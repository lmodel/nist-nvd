    - source
    class_uri: core:Reference
  Weakness:
    name: Weakness
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Weakness
    description: Weakness classification from CWE or a similar taxonomy.
    in_subset:
    - core
    from_schema: https://w3id.org/lmodel/vulnerability-core
