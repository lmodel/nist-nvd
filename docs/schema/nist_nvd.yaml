    - description
    slot_usage:
      source:
        name: source
        required: true
      type:
        name: type
        range: NvdSourceType
        required: true
    class_uri: nist_nvd:NvdWeakness
  NvdConfiguration:
    name: NvdConfiguration
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdConfiguration
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/config
    description: A statement of which product configurations have the vulnerability.
