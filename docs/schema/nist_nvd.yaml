classes:
  NvdResponseMixin:
    name: NvdResponseMixin
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdResponseMixin
    description: The fields of a page of results, which every NVD API response carries.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    mixin: true
    slots:
    - format
    - NvdResponseMixin_timestamp
    - nvdResponseMixin__resultsPerPage
    - nvdResponseMixin__startIndex
    - nvdResponseMixin__totalResults
    - nvdResponseMixin__version
    slot_usage:
      timestamp:
        name: timestamp
        required: true
    attributes:
      resultsPerPage:
        name: resultsPerPage
        description: How many results this page holds.
        slot_uri: nist_nvd:resultsPerPage
        range: integer
        required: true
      startIndex:
        name: startIndex
        description: The position of this page's first result among all the results.
        slot_uri: nist_nvd:startIndex
        range: integer
        required: true
      totalResults:
        name: totalResults
        description: How many results the request matched in all.
        slot_uri: nist_nvd:totalResults
        range: integer
        required: true
      version:
        name: version
        description: The version of the response format.
        slot_uri: nist_nvd:responseVersion
        required: true
    class_uri: nist_nvd:NvdResponseMixin
  NvdCveResponse:
    name: NvdCveResponse
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCveResponse
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#
    description: A page of the vulnerability API's results, or a whole data feed.
    comments:
    - A feed file is one representation of NVD's data, so it relates to a DCAT distribution,
      but this class also covers one page of an API answer.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    close_mappings:
    - schema:DataFeed
    related_mappings:
    - dcat:Distribution
    mixins:
    - NvdResponseMixin
    slots:
    - nvdCveResponse__vulnerabilities
    - NvdCveResponse_format
    - NvdResponseMixin_timestamp
    - nvdResponseMixin__resultsPerPage
    - nvdResponseMixin__startIndex
    - nvdResponseMixin__totalResults
    - nvdResponseMixin__version
    slot_usage:
      format:
        name: format
        equals_string: NVD_CVE
    attributes:
      vulnerabilities:
        name: vulnerabilities
        description: The vulnerabilities on this page.
        range: NvdVulnerability
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdCveResponse
    tree_root: true
  NvdVulnerability:
    name: NvdVulnerability
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdVulnerability
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/def_cve_item
    description: One entry of a response, which only wraps the vulnerability.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - def_cve_item
    close_mappings:
    - schema:DataFeedItem
    slots:
    - nvdVulnerability__cve
    attributes:
      cve:
        name: cve
        description: The vulnerability.
        range: NvdCve
        required: true
        inlined: true
    class_uri: nist_nvd:NvdVulnerability
  NvdCve:
    name: NvdCve
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCve
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/cve_item
    description: A vulnerability as NVD holds it, under its CVE identifier.
    comments:
    - NVD republishes CVE records and adds its own analysis, so this is close to a
      CVE record and not the same thing. A record of this class also repeats four
      fields of the CISA Known Exploited Vulnerabilities catalog when the catalog
      lists it.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - cve_item
    close_mappings:
    - cve:CveRecord
    - stix:StixVulnerability
    - spdx3:Security/Vulnerability
    - sepses_cve:CVE
    - wd:Q631425
    slots:
    - id
    - sourceIdentifier
    - NvdCve_lastModified
    - references
    - nvdCve__vulnStatus
    - nvdCve__published
    - nvdCve__evaluatorComment
    - nvdCve__evaluatorSolution
    - nvdCve__evaluatorImpact
    - nvdCve__cisaExploitAdd
    - nvdCve__cisaActionDue
    - nvdCve__cisaRequiredAction
    - nvdCve__cisaVulnerabilityName
    - nvdCve__cveTags
    - nvdCve__descriptions
    - nvdCve__metrics
    - nvdCve__affected
    - nvdCve__weaknesses
    - nvdCve__configurations
    - nvdCve__vendorComments
    slot_usage:
      lastModified:
        name: lastModified
        required: true
    attributes:
      vulnStatus:
        name: vulnStatus
        description: Where this vulnerability stands in NVD's analysis.
        range: NvdVulnStatus
      published:
        name: published
        description: When NVD published this vulnerability.
        comments:
        - This is NVD's own time, not the CVE record's datePublished. For CVE-2021-44228
          the CVE record says 2021-12-10T00:00:00.000Z and NVD 2021-12-10T10:15:09.143,
          so the mapping is only a related one.
        close_mappings:
        - dcterms:issued
        - schema:datePublished
        - spdx3:Security/publishedTime
        related_mappings:
        - cve:datePublished
        range: nvd_timestamp
        required: true
      evaluatorComment:
        name: evaluatorComment
        description: A remark from NVD's analyst.
      evaluatorSolution:
        name: evaluatorSolution
        description: A way to resolve the vulnerability, from NVD's analyst.
      evaluatorImpact:
        name: evaluatorImpact
        description: What the vulnerability can lead to, from NVD's analyst.
      cisaExploitAdd:
        name: cisaExploitAdd
        description: The day CISA added this vulnerability to its Known Exploited
          Vulnerabilities catalog.
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03,
          read through the API.
        exact_mappings:
        - kev_catalog:dateAdded
        range: date
      cisaActionDue:
        name: cisaActionDue
        description: The day by which CISA says federal agencies must act.
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03,
          read through the API.
        exact_mappings:
        - kev_catalog:dueDate
        range: date
      cisaRequiredAction:
        name: cisaRequiredAction
        description: What CISA says agencies must do about this vulnerability.
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03,
          read through the API.
        exact_mappings:
        - kev_catalog:requiredAction
      cisaVulnerabilityName:
        name: cisaVulnerabilityName
        description: The name CISA gives this vulnerability in its catalog.
        comments:
        - Equal to the catalog's value for all 1,766 entries of the catalog of 2026-11-03,
          read through the API.
        exact_mappings:
        - kev_catalog:vulnerabilityName
      cveTags:
        name: cveTags
        description: The labels the record's sources put on it.
        close_mappings:
        - cve:tags
        range: NvdCveTag
        multivalued: true
        inlined: true
        inlined_as_list: true
      descriptions:
        name: descriptions
        description: What the vulnerability is, in one or more languages.
        close_mappings:
        - cve:descriptions
        range: NvdLangString
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      metrics:
        name: metrics
        description: The scores that NVD and others give this vulnerability.
        close_mappings:
        - cve:metrics
        related_mappings:
        - sepses_cvss:hasCVSS
        range: NvdMetrics
        inlined: true
      affected:
        name: affected
        description: The affected products, by the source that names them.
        close_mappings:
        - cve:affected
        range: NvdAffected
        multivalued: true
        inlined: true
        inlined_as_list: true
      weaknesses:
        name: weaknesses
        description: The weaknesses behind the vulnerability, by the source that names
          them.
        close_mappings:
        - cve:problemTypes
        related_mappings:
        - sepses_cve:hasCWE
        range: NvdWeakness
        multivalued: true
        inlined: true
        inlined_as_list: true
      configurations:
        name: configurations
        description: The product configurations that have the vulnerability.
        close_mappings:
        - cve:cpeApplicability
        - sepses_cve:hasVulnerableConfiguration
        range: NvdConfiguration
        multivalued: true
        inlined: true
        inlined_as_list: true
      vendorComments:
        name: vendorComments
        description: What product vendors have said about this vulnerability.
        range: NvdVendorComment
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdCve
  NvdCveTag:
    name: NvdCveTag
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCveTag
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/cve_item/properties/cveTags/items
    description: The labels that one source puts on a record.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    slots:
    - sourceIdentifier
    - NvdCveTag_tags
    slot_usage:
      tags:
        name: tags
        range: NvdCveTagName
    class_uri: nist_nvd:NvdCveTag
  NvdLangString:
    name: NvdLangString
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdLangString
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/lang_string
    description: A piece of text and the language it is in.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - lang_string
    close_mappings:
    - cve:CveDescription
    slots:
    - lang
    - nvdLangString__value
    attributes:
      value:
        name: value
        description: The text.
        slot_uri: nist_nvd:langStringValue
        required: true
        pattern: ^[\s\S]{0,4096}$
    class_uri: nist_nvd:NvdLangString
  NvdReference:
    name: NvdReference
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdReference
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/reference
    description: A page about a vulnerability, with NVD's labels for what it is.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - reference
    close_mappings:
    - cve:CveReference
    - sepses_cve:Reference
    slots:
    - url
    - NvdReference_source
    - NvdReference_tags
    slot_usage:
      tags:
        name: tags
        range: NvdReferenceTag
      source:
        name: source
        close_mappings:
        - sepses_cve:referenceSource
    class_uri: nist_nvd:NvdReference
  NvdMetrics:
    name: NvdMetrics
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdMetrics
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/cve_item/properties/metrics
    description: The scores of a vulnerability, in a list per scoring system and version.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    slots:
    - nvdMetrics__cvssMetricV40
    - nvdMetrics__cvssMetricV31
    - nvdMetrics__cvssMetricV30
    - nvdMetrics__cvssMetricV2
    - nvdMetrics__ssvcV203
    attributes:
      cvssMetricV40:
        name: cvssMetricV40
        description: The CVSS 4.0 scores.
        range: NvdCvssMetricV40
        multivalued: true
        inlined: true
        inlined_as_list: true
      cvssMetricV31:
        name: cvssMetricV31
        description: The CVSS 3.1 scores.
        range: NvdCvssMetricV31
        multivalued: true
        inlined: true
        inlined_as_list: true
      cvssMetricV30:
        name: cvssMetricV30
        description: The CVSS 3.0 scores.
        range: NvdCvssMetricV30
        multivalued: true
        inlined: true
        inlined_as_list: true
      cvssMetricV2:
        name: cvssMetricV2
        description: The CVSS 2.0 scores.
        range: NvdCvssMetricV2
        multivalued: true
        inlined: true
        inlined_as_list: true
      ssvcV203:
        name: ssvcV203
        description: The SSVC 2.0.3 decisions.
        range: NvdSsvcMetricV203
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdMetrics
  NvdCvssMetricV2:
    name: NvdCvssMetricV2
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCvssMetricV2
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/cvss-v2
    description: A CVSS 2.0 score, who gave it, and NVD's figures beside it.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - cvss-v2
    close_mappings:
    - sepses_cvss:CVSS2BaseMetric
    related_mappings:
    - spdx3:Security/CvssV2VulnAssessmentRelationship
    slots:
    - NvdCvssMetricV2_source
    - NvdCvssMetricV2_type
    - NvdCvssMetricV2_cvssData
    - exploitabilityScore
    - impactScore
    - nvdCvssMetricV2__baseSeverity
    - nvdCvssMetricV2__acInsufInfo
    - nvdCvssMetricV2__obtainAllPrivilege
    - nvdCvssMetricV2__obtainUserPrivilege
    - nvdCvssMetricV2__obtainOtherPrivilege
    - nvdCvssMetricV2__userInteractionRequired
    slot_usage:
      source:
        name: source
        required: true
      type:
        name: type
        range: NvdSourceType
        required: true
      cvssData:
        name: cvssData
        range: CvssV20
    attributes:
      baseSeverity:
        name: baseSeverity
        description: The severity band of the base score, which CVSS 2.0 leaves to
          NVD.
        close_mappings:
