        required: true
        inlined: true
    class_uri: nist_nvd:NvdSsvcMetricV203
  NvdSsvcData:
    name: NvdSsvcData
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdSsvcData
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: ssvc-v2.0.3.json#
    description: One SSVC decision, as the answers chosen on the way through a decision
      tree.
    comments:
    - This class renders the structure of NVD's ssvc-v2.0.3.json. NVD's file also
      names a $schema key, which LinkML's Python generators cannot spell. No record
      of the modified feed of 2026-11-03 holds it, and tests/test_upstream.py lists
      the departure.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    slots:
    - timestamp
    - nvdSsvcData__computed
    - nvdSsvcData__options
    - nvdSsvcData__role
    - nvdSsvcData__version
    - nvdSsvcData__decisionTree
    - nvdSsvcData__id
    - nvdSsvcData__decisionTreeUrl
    - nvdSsvcData__generator
    attributes:
      computed:
        name: computed
        description: The decision in a short form.
      options:
        name: options
        description: The answers given, each as a decision point and its value.
        list_elements_unique: true
        range: NvdSsvcOption
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      role:
        name: role
        description: The role of whoever made the decision, such as CISA Coordinator.
        required: true
      version:
        name: version
        description: The version of SSVC used.
        slot_uri: nist_nvd:ssvcVersion
        required: true
      decisionTree:
        name: decisionTree
        description: The whole decision tree that was used.
        range: NvdSsvcDecisionTree
        inlined: true
      id:
        name: id
        description: The vulnerability the decision is about, by whatever identifier.
        slot_uri: nist_nvd:ssvcSubject
      decisionTreeUrl:
        name: decisionTreeUrl
        description: The address of the decision tree that was used.
        range: uri
      generator:
        name: generator
        description: The tool that wrote this decision.
    class_uri: nist_nvd:NvdSsvcData
  NvdSsvcOption:
    name: NvdSsvcOption
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdSsvcOption
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: ssvc-v2.0.3.json#/properties/options/items
    description: One answer on the way through a decision tree, keyed by its decision
      point.
    comments:
    - NVD's file allows any key, with a string or a list of strings as its value,
      and extra_slots states that. The real data holds one key per object, and only
      these three, each with a string. They are named here because LinkML's Pydantic
      generator ignores extra_slots, so without them the Pydantic model refuses every
      SSVC decision.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    slots:
    - nvdSsvcOption__exploitation
    - nvdSsvcOption__automatable
    - nvdSsvcOption__technicalImpact
    attributes:
      exploitation:
        name: exploitation
        description: How far the vulnerability is known to be exploited, such as none,
          poc or active.
        any_of:
        - range: string
        - range: string
          multivalued: true
      automatable:
        name: automatable
        description: Whether an attacker could automate the attack, as yes or no.
        notes:
        - CVSS 4.0's Automatable differs from this key only by case, so the two share
          one page of the generated docs on a case-insensitive filesystem. Both are
          real keys, so neither is renamed, and tests/test_schema_rules.py pins this
          as the one such pair.
        any_of:
        - range: string
        - range: string
          multivalued: true
      technicalImpact:
        name: technicalImpact
        description: How much control an attacker would gain, as partial or total.
        any_of:
        - range: string
        - range: string
          multivalued: true
    class_uri: nist_nvd:NvdSsvcOption
    extra_slots:
      range_expression:
        any_of:
        - range: string
        - range: string
          multivalued: true
  NvdSsvcDecisionTree:
    name: NvdSsvcDecisionTree
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdSsvcDecisionTree
    description: A whole SSVC decision tree, in the form of the schema NVD's file
      names.
    comments:
    - NVD's file refers to a schema at democert.org for this object, and this project
      does not render that schema. No record of the modified feed of 2026-11-03 holds
      a decision tree, and tests/test_upstream.py lists the departure.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    exact_mappings:
    - linkml:Any
    class_uri: linkml:Any
  NvdAffected:
    name: NvdAffected
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdAffected
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/affected
    description: The products that one source says the vulnerability affects.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - affected
    slots:
    - NvdAffected_source
    - nvdAffected__affectedData
    slot_usage:
      source:
        name: source
        required: true
    attributes:
      affectedData:
        name: affectedData
        description: The products.
        range: NvdAffectedProduct
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: nist_nvd:NvdAffected
  NvdAffectedProduct:
    name: NvdAffectedProduct
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdAffectedProduct
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_affected_1.0.json#
    description: A product and which of its versions have the vulnerability.
    notes:
    - NVD's file has the same keys as the CVE Record Format's product. It drops the
      two rules that the CVE format states, that a product names a vendor and product
      or a collection and package, and that it has versions or a default status, so
      this class does not state them. The default status keeps NVD's own enum beside
      it, so nvd_cve needs no second copy of the CVE module.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    close_mappings:
    - cve:CveProduct
    slots:
    - defaultStatus
    - nvdAffectedProduct__vendor
    - nvdAffectedProduct__product
    - nvdAffectedProduct__collectionURL
    - nvdAffectedProduct__packageName
    - nvdAffectedProduct__cpes
    - nvdAffectedProduct__modules
    - nvdAffectedProduct__programFiles
    - nvdAffectedProduct__programRoutines
    - nvdAffectedProduct__platforms
    - nvdAffectedProduct__repo
    - nvdAffectedProduct__versions
    - nvdAffectedProduct__packageURL
    attributes:
      vendor:
        name: vendor
        description: Who makes or maintains the product.
        close_mappings:
        - cve:vendor
        pattern: ^[\s\S]{1,512}$
      product:
        name: product
        description: The product's name.
        close_mappings:
        - cve:product
        pattern: ^[\s\S]{1,2048}$
      collectionURL:
        name: collectionURL
        description: The address of the package collection that holds the product.
        close_mappings:
        - cve:collectionURL
        range: uri
        pattern: ^[\s\S]{1,2048}$
      packageName:
        name: packageName
        description: The package's name within that collection.
        close_mappings:
        - cve:packageName
        pattern: ^[\s\S]{1,2048}$
      cpes:
        name: cpes
        description: The product's CPE names, in the 2.2 or the 2.3 form.
        comments:
        - NVD's own pattern, with its quotes written as \x22 and \x27, which mean
          the same. The Python generators cut a raw string at a quote.
        close_mappings:
        - cve:cpes
        list_elements_unique: true
        multivalued: true
        pattern: ([c][pP][eE]:/[AHOaho]?(:[A-Za-z0-9._\-~%]*){0,6})|(cpe:2\.3:[aho*\-](:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!\x22#$%&\x27()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){5}(:(([a-zA-Z]{2,3}(-([a-zA-Z]{2}|[0-9]{3}))?)|[*\-]))(:(((\?*|\*?)([a-zA-Z0-9\-._]|(\\[\\*?!\x22#$%&\x27()+,/:;<=>@\[\]\^`{|}~]))+(\?*|\*?))|[*\-])){4})
      modules:
        name: modules
        description: The affected parts of the product.
        close_mappings:
        - cve:modules
        list_elements_unique: true
        multivalued: true
        pattern: ^[\s\S]{1,4096}$
      programFiles:
        name: programFiles
        description: The affected source code files.
        close_mappings:
        - cve:programFiles
        list_elements_unique: true
        multivalued: true
        pattern: ^[\s\S]{1,1024}$
      programRoutines:
        name: programRoutines
        description: The affected source code routines.
        close_mappings:
        - cve:programRoutines
        list_elements_unique: true
        range: NvdProgramRoutine
        multivalued: true
        inlined: true
        inlined_as_list: true
      platforms:
        name: platforms
        description: The platforms the vulnerability is limited to.
        close_mappings:
        - cve:platforms
        list_elements_unique: true
        multivalued: true
        pattern: ^[\s\S]{0,1024}$
        minimum_cardinality: 1
      repo:
        name: repo
        description: The address of the product's source code repository.
        comments:
        - NVD's file says format uri. Some records write an address that RFC 3986
          refuses, such as git://git@gitlab.com:gitlab-org/gitlab.git, so this is
          a string and tests/test_upstream.py lists the departure.
        close_mappings:
        - cve:repo
        pattern: ^[\s\S]{1,2048}$
      versions:
        name: versions
        description: The versions or ranges of versions whose status is known.
        close_mappings:
        - cve:versions
        list_elements_unique: true
        range: NvdAffectedVersion
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
      packageURL:
        name: packageURL
        description: The product's Package URL, with no version in it.
        close_mappings:
        - cve:packageURL
        range: uri
        pattern: ^[\s\S]{1,2048}$
    class_uri: nist_nvd:NvdAffectedProduct
  NvdProgramRoutine:
    name: NvdProgramRoutine
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdProgramRoutine
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_affected_1.0.json#/properties/programRoutines/items
    description: One affected source code routine.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    close_mappings:
    - cve:CveProgramRoutine
    slots:
    - name
    class_uri: nist_nvd:NvdProgramRoutine
  NvdAffectedVersion:
    name: NvdAffectedVersion
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdAffectedVersion
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_affected_1.0.json#/properties/versions/items
    description: The status of one version of a product, or of a range of its versions.
    notes:
    - 'These four rules state the oneOf of NVD''s file, which has four branches: a
      version and a status alone, those with a numbering scheme, and those with a
      scheme and one of the two limits.'
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    close_mappings:
    - cve:CveProductVersion
    slots:
    - NvdAffectedVersion_version
    - NvdAffectedVersion_status
    - nvdAffectedVersion__versionType
    - nvdAffectedVersion__lessThan
    - nvdAffectedVersion__lessThanOrEqual
    - nvdAffectedVersion__changes
    slot_usage:
      version:
        name: version
        description: The version, or the start of the range.
        required: true
        pattern: ^[\s\S]{1,1024}$
      status:
        name: status
        range: NvdVersionStatus
        required: true
    attributes:
      versionType:
        name: versionType
        description: The numbering scheme that orders the versions, such as semver
          or git.
        pattern: ^[\s\S]{1,128}$
      lessThan:
        name: lessThan
        description: The first version after the range.
        pattern: ^[\s\S]{1,1024}$
      lessThanOrEqual:
        name: lessThanOrEqual
        description: The last version in the range.
        pattern: ^[\s\S]{1,1024}$
      changes:
        name: changes
        description: Where the status changes within the range.
        list_elements_unique: true
        range: NvdVersionChange
        multivalued: true
        inlined: true
        inlined_as_list: true
        minimum_cardinality: 1
    class_uri: nist_nvd:NvdAffectedVersion
    rules:
    - preconditions:
        slot_conditions:
          lessThan:
            name: lessThan
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            name: versionType
            value_presence: PRESENT
      description: A range with a less-than limit names the numbering scheme.
    - preconditions:
        slot_conditions:
          lessThanOrEqual:
            name: lessThanOrEqual
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          versionType:
            name: versionType
            value_presence: PRESENT
      description: A range with a less-than-or-equal limit names the numbering scheme.
    - preconditions:
        slot_conditions:
          lessThan:
            name: lessThan
            value_presence: PRESENT
      postconditions:
        slot_conditions:
          lessThanOrEqual:
            name: lessThanOrEqual
            value_presence: ABSENT
      description: A range has one upper limit, not two.
    - preconditions:
        slot_conditions:
          changes:
            name: changes
            value_presence: PRESENT
          lessThan:
            name: lessThan
            value_presence: ABSENT
      postconditions:
        slot_conditions:
          lessThanOrEqual:
            name: lessThanOrEqual
            value_presence: PRESENT
      description: Status changes belong to a range, so they need an upper limit.
  NvdVersionChange:
    name: NvdVersionChange
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdVersionChange
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_affected_1.0.json#/properties/versions/items/properties/changes/items
    description: A point within a range of versions where the status changes.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    close_mappings:
    - cve:CveVersionChange
    slots:
    - at
    - NvdVersionChange_status
    slot_usage:
      status:
        name: status
        range: NvdVersionStatus
        required: true
    class_uri: nist_nvd:NvdVersionChange
  NvdWeakness:
    name: NvdWeakness
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdWeakness
    annotations:
      upstream_definition:
        tag: upstream_definition
        value: cve_api_json_2.0.schema#/definitions/weakness
    description: The weaknesses that one source says lie behind a vulnerability.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    aliases:
    - weakness
    close_mappings:
    - cve:CveProblemType
    slots:
    - NvdWeakness_source
