name: nist_nvd
annotations:
  upstream_sha256:
    tag: upstream_sha256
    value: 2b9c4e8ab7e6e42aa17ea787f58167beff47c119c6f291405f86ac19c6149e01
description: 'A LinkML model of the JSON responses of the NVD API 2.0, from the JSON
  schemas NIST publishes: vulnerabilities, products, match strings and change history.
  NVD''s own keys are the schema''s keys, so a real response validates unchanged.'
title: National Vulnerability Database (NVD)
comments:
- 'The version is the edition of NVD''s vulnerability schema, as its title names it.
  Each module''s header carries the edition of its own schema: 2.0 for the product
  and match-string responses, and 2.0.1 for the change history. scripts/check_upstream_release.py
  compares each file''s SHA-256 with its pin, since NIST changes them in place with
  no release.'
- NVD has four kinds of response and no document that holds them, so each response
  module marks its own response as a tree root, and the generators write NvdCveResponse
  as the top class. Name the kind when validating, with linkml-validate -C NvdCpeResponse.
source: https://csrc.nist.gov/schema/nvd/api/2.0/cve_api_json_2.0.schema
see_also:
- https://lmodel.github.io/nist-nvd
- https://nvd.nist.gov/developers/start-here
id: https://w3id.org/lmodel/nist-nvd
version: 2.2.4
imports:
- linkml:types
- ./nvd_core
- ./nvd_cve
- ./nvd_cpe
- ./nvd_cpematch
- ./nvd_history
- cve/cve_cvss
license: Apache-2.0
prefixes:
  linkml:
    prefix_prefix: linkml
    prefix_reference: https://w3id.org/linkml/
  nist_nvd:
    prefix_prefix: nist_nvd
    prefix_reference: https://w3id.org/lmodel/nist-nvd/
default_prefix: nist_nvd
default_range: string
types:
  string:
    name: string
    definition_uri: https://w3id.org/linkml/String
    description: A character string
    notes:
    - In RDF serializations, a slot with range of string is treated as a literal or
      type xsd:string. If you are authoring schemas in LinkML YAML, the type is referenced
      with the lower case "string".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Text
    base: str
    uri: xsd:string
  integer:
    name: integer
    definition_uri: https://w3id.org/linkml/Integer
    description: An integer
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "integer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Integer
    base: int
    uri: xsd:integer
  boolean:
    name: boolean
    definition_uri: https://w3id.org/linkml/Boolean
    description: A binary (true or false) value
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "boolean".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Boolean
    base: Bool
    uri: xsd:boolean
    repr: bool
  float:
    name: float
    definition_uri: https://w3id.org/linkml/Float
    description: A real number that conforms to the xsd:float specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "float".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Float
    base: float
    uri: xsd:float
  double:
    name: double
    definition_uri: https://w3id.org/linkml/Double
    description: A real number that conforms to the xsd:double specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "double".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:Float
    base: float
    uri: xsd:double
  decimal:
    name: decimal
    definition_uri: https://w3id.org/linkml/Decimal
    description: A real number with arbitrary precision that conforms to the xsd:decimal
      specification
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "decimal".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    broad_mappings:
    - schema:Number
    base: Decimal
    uri: xsd:decimal
  time:
    name: time
    definition_uri: https://w3id.org/linkml/Time
    description: A time object represents a (local) time of day, independent of any
      particular day
    notes:
    - URI is dateTime because OWL reasoners do not work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "time".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Time
    base: XSDTime
    uri: xsd:time
    repr: str
  date:
    name: date
    definition_uri: https://w3id.org/linkml/Date
    description: a date (year, month and day) in an idealized calendar
    notes:
    - URI is dateTime because OWL reasoners don't work with straight date or time
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:Date
    base: XSDDate
    uri: xsd:date
    repr: str
  datetime:
    name: datetime
    definition_uri: https://w3id.org/linkml/Datetime
    description: The combination of a date and time
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    exact_mappings:
    - schema:DateTime
    base: XSDDateTime
    uri: xsd:dateTime
    repr: str
  date_or_datetime:
    name: date_or_datetime
    definition_uri: https://w3id.org/linkml/DateOrDatetime
    description: Either a date or a datetime
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "date_or_datetime".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: linkml:DateOrDatetime
    repr: str
  uriorcurie:
    name: uriorcurie
    definition_uri: https://w3id.org/linkml/Uriorcurie
    description: a URI or a CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uriorcurie".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: URIorCURIE
    uri: xsd:anyURI
    repr: str
  curie:
    name: curie
    definition_uri: https://w3id.org/linkml/Curie
    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  nvd_timestamp:
    name: nvd_timestamp
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdTimestamp
    description: 'A date and time as NVD writes it: ISO 8601, with fractional seconds
      and a UTC offset where the writer gives them.'
    comments:
    - NVD's schemas say format date-time, which is RFC 3339 and needs a UTC offset.
      NVD's records and responses write none, so a validator that checks the format
      refuses every real record. This type admits both forms, and tests/test_upstream.py
      lists the departure.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    typeof: string
    base: str
    uri: xsd:dateTime
    pattern: ^[0-9]{4}-(0[1-9]|1[012])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:([0-5][0-9]|60)(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})?$
  nvd_uuid:
    name: nvd_uuid
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdUuid
    description: A UUID in its usual hexadecimal form with four hyphens.
    comments:
    - NVD's schemas say format uuid, and LinkML has no such type. NVD writes these
      in capitals.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
  nvd_cve_identifier:
    name: nvd_cve_identifier
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCveIdentifier
    description: A CVE identifier, such as CVE-2021-44228.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_core
    typeof: string
    base: str
    uri: xsd:string
    pattern: ^CVE-[0-9]{4}-[0-9]{4,}$
enums:
  NvdVulnStatus:
    name: NvdVulnStatus
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdVulnStatus
    description: Where a vulnerability stands in NVD's own analysis.
    comments:
    - 'NVD''s schema says only that vulnStatus is a string. This list comes from the
      data: the seven values of the 33,378 records read on 2026-11-03, which are the
      modified feed, the records the API marks as known exploited, and eight pages
      of its results spread across all its years. NVD''s page that defines them refuses
      a plain client, so each description says only what the value''s name and the
      data show. A new value fails validation, and the feed test reports it.'
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      Analyzed:
        text: Analyzed
        description: NVD has finished its analysis of the record.
      Deferred:
        text: Deferred
        description: NVD has put off analysing the record.
      Awaiting Analysis:
        text: Awaiting Analysis
        description: NVD has the record and has not begun to analyse it.
      Modified:
        text: Modified
        description: The record has changed since NVD analysed it.
      Received:
        text: Received
        description: The record has just reached NVD.
      Undergoing Analysis:
        text: Undergoing Analysis
        description: NVD is analysing the record now.
      Rejected:
        text: Rejected
        description: The CVE identifier has been rejected.
  NvdCveTagName:
    name: NvdCveTagName
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCveTagName
    description: A label that a CVE record's source puts on the record.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      unsupported-when-assigned:
        text: unsupported-when-assigned
        description: The product had lost its support when the identifier was assigned.
      exclusively-hosted-service:
        text: exclusively-hosted-service
        description: The product exists only as a hosted service.
      disputed:
        text: disputed
        description: A party disputes that this is a vulnerability.
  NvdReferenceTag:
    name: NvdReferenceTag
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdReferenceTag
    description: NVD's label for what a reference is.
    comments:
    - NVD's schema says only that a tag is a string. This list comes from the data,
      the same 33,378 records as NvdVulnStatus. A new value fails validation, and
      the feed test reports it.
    - This is NVD's own vocabulary, not the CVE Program's reference tags, which differ
      in spelling and in membership. The two lists are not mapped to each other, and
      tests/test_mappings.py holds that.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      Broken Link:
        text: Broken Link
        description: The address no longer leads to the content.
      Exploit:
        text: Exploit
        description: The page shows or gives a way to exploit the vulnerability.
      Issue Tracking:
        text: Issue Tracking
        description: An entry in a bug or issue tracker.
      Mailing List:
        text: Mailing List
        description: A message in a mailing list archive.
      Mitigation:
        text: Mitigation
        description: The page says how to reduce the risk without a fix.
      Not Applicable:
        text: Not Applicable
        description: The page does not bear on the vulnerability.
      Patch:
        text: Patch
        description: The page holds or points to a fix.
      Permissions Required:
        text: Permissions Required
        description: Reading the page takes an account or some other access.
      Press/Media Coverage:
        text: Press/Media Coverage
        description: A report in the press or other media.
      Related:
        text: Related
        description: A page on a related matter.
      Product:
        text: Product
        description: A page about the affected product.
      Release Notes:
        text: Release Notes
        description: The notes of a product release.
      Technical Description:
        text: Technical Description
        description: A technical account of the vulnerability.
      Third Party Advisory:
        text: Third Party Advisory
        description: An advisory from someone other than the vendor.
      Tool Signature:
        text: Tool Signature
        description: A signature that a detection tool can use.
      URL Repurposed:
        text: URL Repurposed
        description: The address now leads to something else.
      US Government Resource:
        text: US Government Resource
        description: A page from a body of the United States government.
      VDB Entry:
        text: VDB Entry
        description: An entry in a vulnerability database.
      Vendor Advisory:
        text: Vendor Advisory
        description: An advisory from the product's vendor.
  NvdSourceType:
    name: NvdSourceType
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdSourceType
    description: Whether a score or a weakness comes from the party NVD treats as
      first.
    comments:
    - NVD's schema fixes this list for a score. For a weakness it says only string,
      and the data holds the same two values.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      Primary:
        text: Primary
        description: NVD's first source for the record.
      Secondary:
        text: Secondary
        description: Any other source.
  NvdCvssV2Severity:
    name: NvdCvssV2Severity
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCvssV2Severity
    description: The severity band NVD gives a CVSS 2.0 base score.
    comments:
    - NVD's schema says only that this is a string. The data holds these three values,
      in the same 33,378 records as NvdVulnStatus.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      LOW:
        text: LOW
        description: The low band of CVSS 2.0 base scores.
      MEDIUM:
        text: MEDIUM
        description: The middle band of CVSS 2.0 base scores.
      HIGH:
        text: HIGH
        description: The high band of CVSS 2.0 base scores.
  NvdVersionStatus:
    name: NvdVersionStatus
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdVersionStatus
    description: Whether a version of a product has the vulnerability.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      affected:
        text: affected
        description: This version has the vulnerability.
      unaffected:
        text: unaffected
        description: This version does not have the vulnerability.
      unknown:
        text: unknown
        description: Nobody has said whether this version has the vulnerability.
  NvdOperator:
    name: NvdOperator
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdOperator
    description: How the parts of a configuration combine.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cve
    permissible_values:
      AND:
        text: AND
        description: Every part must hold.
      OR:
        text: OR
        description: At least one part must hold.
  NvdCpeReferenceType:
    name: NvdCpeReferenceType
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpeReferenceType
    description: What a CPE name's reference points to.
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpe
    permissible_values:
      Advisory:
        text: Advisory
        description: A security advisory.
      Change Log:
        text: Change Log
        description: A list of the product's changes.
      Product:
        text: Product
        description: A page about the product.
      Project:
        text: Project
        description: A page about the project behind the product.
      Vendor:
        text: Vendor
        description: A page about the vendor.
      Version:
        text: Version
        description: A page about this version.
  NvdMatchStringStatus:
    name: NvdMatchStringStatus
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdMatchStringStatus
    description: Whether NVD still uses a match string.
    comments:
    - 'NVD''s schema says only that status is a string. This list comes from the data:
      400 match strings the API returned on 2026-11-03, in two pages of its results.
      Nothing in this repository checks more of them, so a further value would fail
      validation here.'
    from_schema: https://w3id.org/lmodel/nist-nvd/nvd_cpematch
    permissible_values:
      Active:
        text: Active
        description: NVD uses this match string.
      Inactive:
        text: Inactive
        description: NVD no longer uses this match string.
  CvssSeverity:
    name: CvssSeverity
    definition_uri: https://w3id.org/lmodel/cve/CvssSeverity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v3.0.json#/definitions/severityType imports/cvss/cvss-v3.1.json#/definitions/severityType
          imports/cvss/cvss-v4.0.json#/definitions/severityType
    description: A CVSS rating in words.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      NONE:
        text: NONE
        description: No severity at all, for a score of 0.
        meaning: spdx_security:CvssSeverityType/none
      LOW:
        text: LOW
        description: The lowest rating above none.
        meaning: spdx_security:CvssSeverityType/low
      MEDIUM:
        text: MEDIUM
        description: The middle rating.
        meaning: spdx_security:CvssSeverityType/medium
      HIGH:
        text: HIGH
        description: The rating below critical.
        meaning: spdx_security:CvssSeverityType/high
      CRITICAL:
        text: CRITICAL
        description: The highest rating.
        meaning: spdx_security:CvssSeverityType/critical
  CvssV2AccessVector:
    name: CvssV2AccessVector
    definition_uri: https://w3id.org/lmodel/cve/CvssV2AccessVector
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/definitions/accessVectorType
    description: How far away an attacker can be, in CVSS 2.0's terms.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      NETWORK:
        text: NETWORK
        description: From anywhere that can route to the system.
      ADJACENT_NETWORK:
        text: ADJACENT_NETWORK
        description: Only from the same local network segment.
      LOCAL:
        text: LOCAL
        description: Only with an account on the system or hands on it.
  CvssV2AccessComplexity:
    name: CvssV2AccessComplexity
    definition_uri: https://w3id.org/lmodel/cve/CvssV2AccessComplexity
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/definitions/accessComplexityType
    description: How hard the flaw is to use, in CVSS 2.0's terms.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      HIGH:
        text: HIGH
        description: Only under unusual, hard-to-arrange conditions.
      MEDIUM:
        text: MEDIUM
        description: Under conditions that take some arranging.
      LOW:
        text: LOW
        description: With no special conditions.
  CvssV2Authentication:
    name: CvssV2Authentication
    definition_uri: https://w3id.org/lmodel/cve/CvssV2Authentication
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/definitions/authenticationType
    description: How many logins an attacker needs, in CVSS 2.0's terms.
    from_schema: https://w3id.org/lmodel/cve/cve_cvss
    permissible_values:
      MULTIPLE:
        text: MULTIPLE
