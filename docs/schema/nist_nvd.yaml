classes:
  NVDEntry:
    name: NVDEntry
    definition_uri: https://w3id.org/lmodel/nist-nvd/NVDEntry
    description: Enriched NVD representation of a CVE entry.
    notes:
    - If NVD and CNA CVSS values match, NVD displays only the CNA values.
    - Rejected CVEs are determined by the CVE Program rather than NVD.
    comments:
    - Current Description is the currently visible CVE description.
    - Analysis Description captures the description present when NVD enrichment occurred.
    in_subset:
    - nvd_feed
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    exact_mappings:
    - WIKIDATA:Q631425
    close_mappings:
    - cve:CVERecord
    is_a: Vulnerability
    slots:
    - Vulnerability_cve_id
    - title
    - published_date
    - last_modified_date
    - products
    - impact
    - description_source
    - analysis_description
    - metrics
    - configurations
    - NVDEntry_references
    - NVDEntry_weaknesses
    - vendor_comments
    - nvd_tags
    - cve_tags
    - workflow_status
    - status_transitions
    - known_exploited
    - cwe_view
    - date_received
    - NVDEntry_status
    - NVDEntry_description
    slot_usage:
      references:
        name: references
        range: NVDReference
      weaknesses:
        name: weaknesses
        range: NVDWeakness
      status:
        name: status
        range: NVDWorkflowStatus
      description:
        name: description
        description: Current Description shown on the NVD detail page.
        required: true
    class_uri: nvd:NVDEntry
  MetricSet:
    name: MetricSet
    definition_uri: https://w3id.org/lmodel/nist-nvd/MetricSet
    description: Container for all metric views across CVSS versions.
    comments:
    - NVD detail pages expose button toggles for CVSS v4.0, v3.x, and v2.0.
    in_subset:
    - metrics
    from_schema: https://w3id.org/lmodel/nist-nvd
    close_mappings:
    - cve:MetricEntry
    slots:
    - cvss_v4_metrics
    - cvss_v3_metrics
    - cvss_v2_metrics
    - score_notes
    class_uri: nvd:MetricSet
  CVSSMetric:
    name: CVSSMetric
    definition_uri: https://w3id.org/lmodel/nist-nvd/CVSSMetric
    description: Individual CVSS vector and score attribution.
    in_subset:
    - metrics
    from_schema: https://w3id.org/lmodel/nist-nvd
    broad_mappings:
    - cve:CvssV4_0
    - cve:CvssV3
    - cve:CvssV2_0
    slots:
    - version
    - vector_string
    - base_score
    - base_severity
    - CVSSMetric_source
    - provider_label
    - scoring_justification
    slot_usage:
      source:
        name: source
        range: ScoreSource
    class_uri: nvd:CVSSMetric
  CVSSScoreNote:
    name: CVSSScoreNote
    definition_uri: https://w3id.org/lmodel/nist-nvd/CVSSScoreNote
    description: Additional explanatory note for CVSS display conditions.
    in_subset:
    - metrics
    from_schema: https://w3id.org/lmodel/nist-nvd
    slots:
    - note_id
    - message
    - source
    - created
    class_uri: nvd:CVSSScoreNote
  CPEConfiguration:
    name: CPEConfiguration
    definition_uri: https://w3id.org/lmodel/nist-nvd/CPEConfiguration
    description: Logical grouping of CPE match criteria for affected software.
    comments:
    - Supported rendering categories include Basic, Running On/With, and Advanced.
    in_subset:
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    close_mappings:
    - cve:CpeApplicabilityElement
    slots:
    - configuration_id
    - configuration_type
    - operator
    - children
    - matches
    - summary
    class_uri: nvd:CPEConfiguration
  CPEMatch:
    name: CPEMatch
    definition_uri: https://w3id.org/lmodel/nist-nvd/CPEMatch
    description: Leaf-level CPE match criterion and optional version bounds.
    notes:
    - Matching CPE names can be exposed in expanded detail-page sections.
    in_subset:
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    exact_mappings:
    - cve:CpeMatch
    slots:
    - match_criteria_id
    - criteria
    - cpe23_uri
    - vulnerable
    - version_start_including
    - version_start_excluding
    - version_end_including
    - version_end_excluding
    - matched_cpe_names
    class_uri: nvd:CPEMatch
  NVDReference:
    name: NVDReference
    definition_uri: https://w3id.org/lmodel/nist-nvd/NVDReference
    description: Reference URL with NVD resource tags.
    in_subset:
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    close_mappings:
    - cve:CveReference
    is_a: Reference
    slots:
    - name
    - resource_tags
    - NVDReference_url
    - NVDReference_source
    slot_usage:
      url:
        name: url
        required: true
      source:
        name: source
        required: false
    class_uri: nvd:NVDReference
  NVDWeakness:
    name: NVDWeakness
    definition_uri: https://w3id.org/lmodel/nist-nvd/NVDWeakness
    description: Weakness row as presented on the NVD detail page.
    comments:
    - NVD uses CWE-1003 for simplified mapping of published vulnerabilities.
    in_subset:
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    close_mappings:
    - cve:ProblemType
    is_a: Weakness
    slots:
    - description
    - NVDWeakness_source
    - NVDWeakness_cwe_id
    - NVDWeakness_name
    slot_usage:
      cwe_id:
        name: cwe_id
        required: true
      name:
        name: name
        required: true
      source:
        name: source
        description: Source column value, such as NIST or ASSIGNER.
        required: true
    class_uri: nvd:NVDWeakness
  VendorComment:
    name: VendorComment
    definition_uri: https://w3id.org/lmodel/nist-nvd/VendorComment
    description: Comment provided by vendor during NVD analysis.
    in_subset:
    - nvd_feed
    from_schema: https://w3id.org/lmodel/nist-nvd
    slots:
    - vendor
    - comment
    - last_modified_date
    class_uri: nvd:VendorComment
  KnownExploitedVulnerability:
    name: KnownExploitedVulnerability
    definition_uri: https://w3id.org/lmodel/nist-nvd/KnownExploitedVulnerability
    description: CISA KEV information rendered on the NVD detail page.
    notes:
    - Present only when the CVE appears in the CISA Known Exploited Vulnerabilities
      catalog.
    in_subset:
    - detail_page
    from_schema: https://w3id.org/lmodel/nist-nvd
    slots:
    - date_added
    - due_date
    - required_action
    - kev_reference
    class_uri: nvd:KnownExploitedVulnerability
  StatusTransition:
    name: StatusTransition
    definition_uri: https://w3id.org/lmodel/nist-nvd/StatusTransition
    description: State transition event in NVD enrichment workflow.
    in_subset:
    - status_workflow
    from_schema: https://w3id.org/lmodel/nist-nvd
    slots:
    - transition_id
    - from_status
    - to_status
    - event_source
    - transition_time
    - rationale
    class_uri: nvd:StatusTransition
  Vulnerability:
    name: Vulnerability
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Vulnerability
    description: Abstract base representation of a security vulnerability. Extended
      by source-specific schemas (KEV, CVE, NVD).
    in_subset:
    - core
    from_schema: https://w3id.org/lmodel/vulnerability-core
    exact_mappings:
    - WIKIDATA:Q631425
    related_mappings:
    - schema:SoftwareApplication
    - cwe:Weakness
    broad_mappings:
    - nvd:NVDEntry
    - kev_catalog:KevEntry
    abstract: true
    slots:
    - Vulnerability_cve_id
    - title
    - Vulnerability_description
    - published_date
    - last_modified_date
    - products
    - weaknesses
    - references
    - impact
    - status
    slot_usage:
      cve_id:
        name: cve_id
        recommended: true
      description:
        name: description
        recommended: true
    class_uri: core:Vulnerability
  Product:
    name: Product
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Product
    description: Software or hardware entity affected by the vulnerability.
    in_subset:
    - core
    from_schema: https://w3id.org/lmodel/vulnerability-core
    exact_mappings:
    - schema:SoftwareApplication
    related_mappings:
    - kev_catalog:KevEntry
    slots:
    - vendor
    - name
    - version
    - platforms
    class_uri: core:Product
  Reference:
    name: Reference
    definition_uri: https://w3id.org/lmodel/vulnerability-core/Reference
    description: External reference such as an advisory or article.
    in_subset:
    - core
    from_schema: https://w3id.org/lmodel/vulnerability-core
    exact_mappings:
    - schema:CreativeWork
    close_mappings:
    - cwe:ExternalReference
    - nvd:NVDReference
    related_mappings:
    - kev_catalog:notes
    slots:
