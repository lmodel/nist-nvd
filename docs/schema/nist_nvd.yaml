    slot_usage:
      operator:
        name: operator
        required: true
    attributes:
      cpeMatch:
        name: cpeMatch
        description: The CPE matches of this part.
        range: NvdCpeMatch
        required: true
        multivalued: true
        inlined: true
        inlined_as_list: true
    class_uri: nist_nvd:NvdConfigurationNode
  NvdCpeMatch:
    name: NvdCpeMatch
    definition_uri: https://w3id.org/lmodel/nist-nvd/NvdCpeMatch
    annotations:
      upstream_definition:
