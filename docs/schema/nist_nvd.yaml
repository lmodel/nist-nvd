    - CvssV30
    - CvssV31
    - CvssV40
    range: string
  vectorString:
    name: vectorString
    definition_uri: https://w3id.org/lmodel/cve/vectorString
    annotations:
      upstream_path:
        tag: upstream_path
        value: imports/cvss/cvss-v2.0.json#/properties/vectorString imports/cvss/cvss-v3.0.json#/properties/vectorString
          imports/cvss/cvss-v3.1.json#/properties/vectorString imports/cvss/cvss-v4.0.json#/properties/vectorString
