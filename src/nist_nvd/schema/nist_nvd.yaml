---
id: https://w3id.org/lmodel/nist-nvd
name: nist_nvd
title: National Vulnerability Database (NVD)
description: >-
  A LinkML model of the JSON responses of the NVD API 2.0, from the JSON schemas
  NIST publishes: vulnerabilities, products, match strings and change history.
  NVD's own keys are the schema's keys, so a real response validates unchanged.
version: 2.2.4
source: https://csrc.nist.gov/schema/nvd/api/2.0/cve_api_json_2.0.schema
license: Apache-2.0
see_also:
  - https://lmodel.github.io/nist-nvd
  - https://nvd.nist.gov/developers/start-here
annotations:
  upstream_sha256: 2b9c4e8ab7e6e42aa17ea787f58167beff47c119c6f291405f86ac19c6149e01
comments:
  - >-
    The version is the edition of NVD's vulnerability schema, as its title names
    it. Each module's header carries the edition of its own schema: 2.0 for the
    product and match-string responses, and 2.0.1 for the change history.
    scripts/check_upstream_release.py compares each file's SHA-256 with its pin,
    since NIST changes them in place with no release.
  - >-
    NVD has four kinds of response and no document that holds them, so each
    response module marks its own response as a tree root, and the generators
    write NvdCveResponse as the top class. Name the kind when validating, with
    linkml-validate -C NvdCpeResponse.
default_prefix: nist_nvd
default_range: string

prefixes:
  linkml: https://w3id.org/linkml/
  nist_nvd: https://w3id.org/lmodel/nist-nvd/

imports:
  - linkml:types
  - ./nvd_core
  - ./nvd_cve
  - ./nvd_cpe
  - ./nvd_cpematch
  - ./nvd_history
