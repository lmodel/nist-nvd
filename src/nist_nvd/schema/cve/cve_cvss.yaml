---
id: https://w3id.org/lmodel/cve/cve_cvss
name: cve_cvss
title: CVSS scores in the CVE Record Format
description: >-
  The Common Vulnerability Scoring System (CVSS) score objects a CVE record can
  carry, versions 2.0, 3.0, 3.1 and 4.0, with the property names and value lists
  of the JSON schemas that FIRST maintains and the CVE Program adapts.
version: "5.2.0"
source: https://github.com/CVEProject/cve-schema/tree/v5.2.0/schema/imports/cvss
license: Apache-2.0
see_also:
  - https://www.first.org/cvss/data-representations
  - https://lmodel.github.io/cve
comments:
  - >-
    The version is the edition of the CVE Record Format whose copies of the CVSS
    schemas this module renders. Those copies differ from FIRST's own, as the
    README beside them says, so a key or value here follows the CVE Program's
    copy where the two part. The CVSS 4.0 modified subsequent impacts are one
    such place.
  - >-
    The module imports only the LinkML types, so another schema can take it
    alone. lmodel/nist-nvd vendors this file by its git object hash.
  - >-
    SPDX's CVSS classes are relationships that tie a score to a vulnerability
    and to what it affects. A class here is the score alone, so those mappings
    are only related. The SEPSES classes are scores built from NVD's data, and
    SEPSES has none for version 4.0, so that class takes its general one as broad.
notes:
  - >-
    Keys and permissible values keep the upstream's spelling, so a real score
    object validates unchanged. Names that recur across CVSS versions are
    top-level slots that each class narrows with slot_usage, since the value
    lists differ; a key one version alone uses is an attribute of its class.

prefixes:
  cve: https://w3id.org/lmodel/cve/
  linkml: https://w3id.org/linkml/
  sepses_cvss: http://w3id.org/sepses/vocab/ref/cvss#
  spdx_security: https://spdx.org/rdf/3.0.1/terms/Security/
default_prefix: cve
default_range: string

imports:
  - linkml:types

classes:

  CvssSeverityBandsMixin:
    mixin: true
    description: >-
      The base score and base severity of a CVSS version with severity bands,
      and the bands that tie one to the other.
    comments:
      - >-
        The upstream also rules out a score that is not a multiple of 0.1, as a
        list of numbers no LinkML range can state. tests/cve_rules.py checks that.
    annotations:
      upstream_path: >-
        imports/cvss/cvss-v3.0.json#/anyOf
        imports/cvss/cvss-v3.1.json#/anyOf
        imports/cvss/cvss-v4.0.json#/allOf/0/anyOf
    slots:
      - baseScore
      - baseSeverity
    rules:
      - title: base severity NONE
        description: A base severity of NONE goes with a base score of exactly 0.
        preconditions:
          slot_conditions:
            baseSeverity:
              equals_string: NONE
        postconditions:
          slot_conditions:
            baseScore:
              minimum_value: 0
              maximum_value: 0
      - title: base severity LOW
        description: A base severity of LOW goes with a base score from 0.1 to 3.9.
        preconditions:
          slot_conditions:
            baseSeverity:
              equals_string: LOW
        postconditions:
          slot_conditions:
            baseScore:
              minimum_value: 0.1
              maximum_value: 3.9
      - title: base severity MEDIUM
        description: A base severity of MEDIUM goes with a base score from 4.0 to 6.9.
        preconditions:
          slot_conditions:
            baseSeverity:
              equals_string: MEDIUM
        postconditions:
          slot_conditions:
            baseScore:
              minimum_value: 4.0
              maximum_value: 6.9
      - title: base severity HIGH
        description: A base severity of HIGH goes with a base score from 7.0 to 8.9.
        preconditions:
          slot_conditions:
            baseSeverity:
              equals_string: HIGH
        postconditions:
          slot_conditions:
            baseScore:
              minimum_value: 7.0
              maximum_value: 8.9
      - title: base severity CRITICAL
        description: A base severity of CRITICAL goes with a base score from 9.0 to 10.
        preconditions:
          slot_conditions:
            baseSeverity:
              equals_string: CRITICAL
        postconditions:
          slot_conditions:
            baseScore:
              minimum_value: 9.0
              maximum_value: 10.0

  CvssV20:
    description: A score under CVSS version 2.0, which has no severity bands.
    annotations:
      upstream_path: imports/cvss/cvss-v2.0.json#/
    close_mappings:
      - sepses_cvss:CVSS2BaseMetric
    related_mappings:
      - spdx_security:CvssV2VulnAssessmentRelationship
    slots:
      - version
      - vectorString
      - baseScore
      - confidentialityImpact
      - integrityImpact
      - availabilityImpact
      - remediationLevel
      - reportConfidence
      - temporalScore
      - confidentialityRequirement
      - integrityRequirement
      - availabilityRequirement
      - environmentalScore
    slot_usage:
      version:
        required: true
        equals_string: "2.0"
      vectorString:
        pattern: '^((AV:[NAL]|AC:[LMH]|Au:[MSN]|[CIA]:[NPC]|E:(U|POC|F|H|ND)|RL:(OF|TF|W|U|ND)|RC:(UC|UR|C|ND)|CDP:(N|L|LM|MH|H|ND)|TD:(N|L|M|H|ND)|[CIA]R:(L|M|H|ND))/)*(AV:[NAL]|AC:[LMH]|Au:[MSN]|[CIA]:[NPC]|E:(U|POC|F|H|ND)|RL:(OF|TF|W|U|ND)|RC:(UC|UR|C|ND)|CDP:(N|L|LM|MH|H|ND)|TD:(N|L|M|H|ND)|[CIA]R:(L|M|H|ND))$'
      confidentialityImpact:
        range: CvssV2Impact
      integrityImpact:
        range: CvssV2Impact
      availabilityImpact:
        range: CvssV2Impact
      remediationLevel:
        range: CvssRemediationLevel
      reportConfidence:
        range: CvssV2ReportConfidence
      confidentialityRequirement:
        range: CvssRequirement
      integrityRequirement:
        range: CvssRequirement
      availabilityRequirement:
        range: CvssRequirement
    attributes:
      accessVector:
        description: How far away an attacker can be when using the flaw, in CVSS 2.0's terms.
        range: CvssV2AccessVector
        close_mappings:
          - sepses_cvss:accessVector
        annotations:
          upstream_path: imports/cvss/cvss-v2.0.json#/properties/accessVector
      accessComplexity:
        description: How hard the flaw is to use once the attacker can reach it.
        range: CvssV2AccessComplexity
        close_mappings:
          - sepses_cvss:accessComplexity
        annotations:
          upstream_path: imports/cvss/cvss-v2.0.json#/properties/accessComplexity
      authentication:
        description: How many times an attacker must log in before using the flaw.
        range: CvssV2Authentication
        close_mappings:
          - sepses_cvss:authentication
        annotations:
          upstream_path: imports/cvss/cvss-v2.0.json#/properties/authentication
      exploitability:
        description: How far working attack code has come, in CVSS 2.0's terms.
        range: CvssExploitCodeMaturity
        annotations:
          upstream_path: imports/cvss/cvss-v2.0.json#/properties/exploitability
      collateralDamagePotential:
        description: How much loss a successful attack could cause beyond the system itself.
        range: CvssV2CollateralDamagePotential
        annotations:
          upstream_path: imports/cvss/cvss-v2.0.json#/properties/collateralDamagePotential
      targetDistribution:
        description: How much of the scorer's environment is exposed to the flaw.
        range: CvssV2TargetDistribution
        annotations:
          upstream_path: imports/cvss/cvss-v2.0.json#/properties/targetDistribution

  CvssV30:
    description: A score under CVSS version 3.0.
    mixins:
      - CvssSeverityBandsMixin
    annotations:
      upstream_path: imports/cvss/cvss-v3.0.json#/
    close_mappings:
      - sepses_cvss:CVSS3BaseMetric
    related_mappings:
      - spdx_security:CvssV3VulnAssessmentRelationship
    slots:
      - version
      - vectorString
      - attackVector
      - attackComplexity
      - privilegesRequired
      - userInteraction
      - scope
      - confidentialityImpact
      - integrityImpact
      - availabilityImpact
      - exploitCodeMaturity
      - remediationLevel
      - reportConfidence
      - temporalScore
      - temporalSeverity
      - confidentialityRequirement
      - integrityRequirement
      - availabilityRequirement
      - modifiedAttackVector
      - modifiedAttackComplexity
      - modifiedPrivilegesRequired
      - modifiedUserInteraction
      - modifiedScope
      - modifiedConfidentialityImpact
      - modifiedIntegrityImpact
      - modifiedAvailabilityImpact
      - environmentalScore
      - environmentalSeverity
    slot_usage:
      version:
        required: true
        equals_string: "3.0"
      vectorString:
        pattern: '^CVSS:3[.]0/((AV:[NALP]|AC:[LH]|PR:[UNLH]|UI:[NR]|S:[UC]|[CIA]:[NLH]|E:[XUPFH]|RL:[XOTWU]|RC:[XURC]|[CIA]R:[XLMH]|MAV:[XNALP]|MAC:[XLH]|MPR:[XUNLH]|MUI:[XNR]|MS:[XUC]|M[CIA]:[XNLH])/)*(AV:[NALP]|AC:[LH]|PR:[UNLH]|UI:[NR]|S:[UC]|[CIA]:[NLH]|E:[XUPFH]|RL:[XOTWU]|RC:[XURC]|[CIA]R:[XLMH]|MAV:[XNALP]|MAC:[XLH]|MPR:[XUNLH]|MUI:[XNR]|MS:[XUC]|M[CIA]:[XNLH])$'
      attackVector:
        range: CvssV3AttackVector
      attackComplexity:
        range: CvssAttackComplexity
      privilegesRequired:
        range: CvssPrivilegesRequired
      userInteraction:
        range: CvssV3UserInteraction
      confidentialityImpact:
        range: CvssImpact
      integrityImpact:
        range: CvssImpact
      availabilityImpact:
        range: CvssImpact
      remediationLevel:
        range: CvssRemediationLevel
      reportConfidence:
        range: CvssV3ReportConfidence
      confidentialityRequirement:
        range: CvssRequirement
      integrityRequirement:
        range: CvssRequirement
      availabilityRequirement:
        range: CvssRequirement
      modifiedAttackVector:
        range: CvssV3ModifiedAttackVector
      modifiedAttackComplexity:
        range: CvssModifiedAttackComplexity
      modifiedPrivilegesRequired:
        range: CvssModifiedPrivilegesRequired
      modifiedUserInteraction:
        range: CvssV3ModifiedUserInteraction
      modifiedConfidentialityImpact:
        range: CvssModifiedImpact
      modifiedIntegrityImpact:
        range: CvssModifiedImpact
      modifiedAvailabilityImpact:
        range: CvssModifiedImpact

  CvssV31:
    description: A score under CVSS version 3.1.
    mixins:
      - CvssSeverityBandsMixin
    annotations:
      upstream_path: imports/cvss/cvss-v3.1.json#/
    close_mappings:
      - sepses_cvss:CVSS3BaseMetric
    related_mappings:
      - spdx_security:CvssV3VulnAssessmentRelationship
    slots:
      - version
      - vectorString
      - attackVector
      - attackComplexity
      - privilegesRequired
      - userInteraction
      - scope
      - confidentialityImpact
      - integrityImpact
      - availabilityImpact
      - exploitCodeMaturity
      - remediationLevel
      - reportConfidence
      - temporalScore
      - temporalSeverity
      - confidentialityRequirement
      - integrityRequirement
      - availabilityRequirement
      - modifiedAttackVector
      - modifiedAttackComplexity
      - modifiedPrivilegesRequired
      - modifiedUserInteraction
      - modifiedScope
      - modifiedConfidentialityImpact
      - modifiedIntegrityImpact
      - modifiedAvailabilityImpact
      - environmentalScore
      - environmentalSeverity
    slot_usage:
      version:
        required: true
        equals_string: "3.1"
      vectorString:
        pattern: '^CVSS:3[.]1/((AV:[NALP]|AC:[LH]|PR:[NLH]|UI:[NR]|S:[UC]|[CIA]:[NLH]|E:[XUPFH]|RL:[XOTWU]|RC:[XURC]|[CIA]R:[XLMH]|MAV:[XNALP]|MAC:[XLH]|MPR:[XNLH]|MUI:[XNR]|MS:[XUC]|M[CIA]:[XNLH])/)*(AV:[NALP]|AC:[LH]|PR:[NLH]|UI:[NR]|S:[UC]|[CIA]:[NLH]|E:[XUPFH]|RL:[XOTWU]|RC:[XURC]|[CIA]R:[XLMH]|MAV:[XNALP]|MAC:[XLH]|MPR:[XNLH]|MUI:[XNR]|MS:[XUC]|M[CIA]:[XNLH])$'
      attackVector:
        range: CvssV3AttackVector
      attackComplexity:
        range: CvssAttackComplexity
      privilegesRequired:
        range: CvssPrivilegesRequired
      userInteraction:
        range: CvssV3UserInteraction
      confidentialityImpact:
        range: CvssImpact
      integrityImpact:
        range: CvssImpact
      availabilityImpact:
        range: CvssImpact
      remediationLevel:
        range: CvssRemediationLevel
      reportConfidence:
        range: CvssV3ReportConfidence
      confidentialityRequirement:
        range: CvssRequirement
      integrityRequirement:
        range: CvssRequirement
      availabilityRequirement:
        range: CvssRequirement
      modifiedAttackVector:
        range: CvssV3ModifiedAttackVector
      modifiedAttackComplexity:
        range: CvssModifiedAttackComplexity
      modifiedPrivilegesRequired:
        range: CvssModifiedPrivilegesRequired
      modifiedUserInteraction:
        range: CvssV3ModifiedUserInteraction
      modifiedConfidentialityImpact:
        range: CvssModifiedImpact
      modifiedIntegrityImpact:
        range: CvssModifiedImpact
      modifiedAvailabilityImpact:
        range: CvssModifiedImpact

  CvssV40:
    description: A score under CVSS version 4.0.
    mixins:
      - CvssSeverityBandsMixin
    comments:
      - >-
        The upstream's rules name threatScore, threatSeverity, environmentalScore
        and environmentalSeverity, but its list of properties has none of them and
        it refuses any other key, so a score object cannot carry them and this class
        has no such slots.
    annotations:
      upstream_path: imports/cvss/cvss-v4.0.json#/
    broad_mappings:
      - sepses_cvss:CVSS
    related_mappings:
      - spdx_security:CvssV4VulnAssessmentRelationship
    slots:
      - version
      - vectorString
      - attackVector
      - attackComplexity
      - privilegesRequired
      - userInteraction
      - confidentialityRequirement
      - integrityRequirement
      - availabilityRequirement
      - modifiedAttackVector
      - modifiedAttackComplexity
      - modifiedPrivilegesRequired
      - modifiedUserInteraction
    slot_usage:
      version:
        required: true
        equals_string: "4.0"
      vectorString:
        pattern: '^CVSS:4[.]0/AV:[NALP]/AC:[LH]/AT:[NP]/PR:[NLH]/UI:[NPA]/VC:[HLN]/VI:[HLN]/VA:[HLN]/SC:[HLN]/SI:[HLN]/SA:[HLN](/E:[XAPU])?(/CR:[XHML])?(/IR:[XHML])?(/AR:[XHML])?(/MAV:[XNALP])?(/MAC:[XLH])?(/MAT:[XNP])?(/MPR:[XNLH])?(/MUI:[XNPA])?(/MVC:[XNLH])?(/MVI:[XNLH])?(/MVA:[XNLH])?(/MSC:[XNLH])?(/MSI:[XNLHS])?(/MSA:[XNLHS])?(/S:[XNP])?(/AU:[XNY])?(/R:[XAUI])?(/V:[XDC])?(/RE:[XLMH])?(/U:(X|Clear|Green|Amber|Red))?$'
      attackVector:
        range: CvssV4AttackVector
      attackComplexity:
        range: CvssAttackComplexity
      privilegesRequired:
        range: CvssPrivilegesRequired
      userInteraction:
        range: CvssV4UserInteraction
      confidentialityRequirement:
        range: CvssRequirement
        ifabsent: CvssRequirement(NOT_DEFINED)
      integrityRequirement:
        range: CvssRequirement
        ifabsent: CvssRequirement(NOT_DEFINED)
      availabilityRequirement:
        range: CvssRequirement
        ifabsent: CvssRequirement(NOT_DEFINED)
      modifiedAttackVector:
        range: CvssV4ModifiedAttackVector
        ifabsent: CvssV4ModifiedAttackVector(NOT_DEFINED)
      modifiedAttackComplexity:
        range: CvssModifiedAttackComplexity
        ifabsent: CvssModifiedAttackComplexity(NOT_DEFINED)
      modifiedPrivilegesRequired:
        range: CvssModifiedPrivilegesRequired
        ifabsent: CvssModifiedPrivilegesRequired(NOT_DEFINED)
      modifiedUserInteraction:
        range: CvssV4ModifiedUserInteraction
        ifabsent: CvssV4ModifiedUserInteraction(NOT_DEFINED)
    attributes:
      attackRequirements:
        description: Whether the attack needs conditions in the target that the attacker does not control.
        range: CvssV4AttackRequirements
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/attackRequirements
      vulnConfidentialityImpact:
        description: How much information in the vulnerable system an attack could expose.
        range: CvssImpact
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/vulnConfidentialityImpact
      vulnIntegrityImpact:
        description: How much an attack could change in the vulnerable system.
        range: CvssImpact
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/vulnIntegrityImpact
      vulnAvailabilityImpact:
        description: How much an attack could disrupt the vulnerable system.
        range: CvssImpact
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/vulnAvailabilityImpact
      subConfidentialityImpact:
        description: How much information in other, connected systems an attack could expose.
        range: CvssImpact
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/subConfidentialityImpact
      subIntegrityImpact:
        description: How much an attack could change in other, connected systems.
        range: CvssImpact
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/subIntegrityImpact
      subAvailabilityImpact:
        description: How much an attack could disrupt other, connected systems.
        range: CvssImpact
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/subAvailabilityImpact
      exploitMaturity:
        description: How much is known about attacks on this flaw, in CVSS 4.0's terms.
        range: CvssV4ExploitMaturity
        ifabsent: CvssV4ExploitMaturity(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/exploitMaturity
      modifiedAttackRequirements:
        description: The attack requirements as the scorer's own environment changes them.
        range: CvssV4ModifiedAttackRequirements
        ifabsent: CvssV4ModifiedAttackRequirements(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedAttackRequirements
      modifiedVulnConfidentialityImpact:
        description: The confidentiality impact on the vulnerable system, in the scorer's environment.
        range: CvssModifiedImpact
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedVulnConfidentialityImpact
      modifiedVulnIntegrityImpact:
        description: The integrity impact on the vulnerable system, in the scorer's environment.
        range: CvssModifiedImpact
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedVulnIntegrityImpact
      modifiedVulnAvailabilityImpact:
        description: The availability impact on the vulnerable system, in the scorer's environment.
        range: CvssModifiedImpact
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedVulnAvailabilityImpact
      modifiedSubConfidentialityImpact:
        description: The confidentiality impact on connected systems, in the scorer's environment.
        range: CvssModifiedImpact
        ifabsent: CvssModifiedImpact(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedSubConfidentialityImpact
      modifiedSubIntegrityImpact:
        description: The integrity impact on connected systems, in the scorer's environment.
        range: CvssV4ModifiedSubsequentImpact
        ifabsent: CvssV4ModifiedSubsequentImpact(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedSubIntegrityImpact
      modifiedSubAvailabilityImpact:
        description: The availability impact on connected systems, in the scorer's environment.
        range: CvssV4ModifiedSubsequentImpact
        ifabsent: CvssV4ModifiedSubsequentImpact(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/modifiedSubAvailabilityImpact
      Safety:
        description: Whether an attack could put people's safety at risk.
        range: CvssV4Safety
        ifabsent: CvssV4Safety(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/Safety
      Automatable:
        description: Whether an attacker could automate every step of an attack across many targets.
        range: CvssV4Automatable
        ifabsent: CvssV4Automatable(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/Automatable
      Recovery:
        description: How the affected system comes back after an attack.
        range: CvssV4Recovery
        ifabsent: CvssV4Recovery(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/Recovery
      valueDensity:
        description: Whether one successful attack gains the attacker a little or a lot of a resource.
        range: CvssV4ValueDensity
        ifabsent: CvssV4ValueDensity(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/valueDensity
      vulnerabilityResponseEffort:
        description: How much work it takes a consumer to respond to the flaw.
        range: CvssV4ResponseEffort
        ifabsent: CvssV4ResponseEffort(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/vulnerabilityResponseEffort
      providerUrgency:
        description: How urgent the product's supplier says the flaw is, as a colour.
        range: CvssV4ProviderUrgency
        ifabsent: CvssV4ProviderUrgency(NOT_DEFINED)
        annotations:
          upstream_path: imports/cvss/cvss-v4.0.json#/properties/providerUrgency

slots:

  version:
    description: A version string. On a score it is the CVSS version; on a product entry, the product's.
    slot_uri: cve:version
    comments:
      - Each class that uses it narrows it. A top-level slot, so that lokf adapt renames it beside LOKF's version.
    annotations:
      upstream_path: >-
        imports/cvss/cvss-v2.0.json#/properties/version
        imports/cvss/cvss-v3.0.json#/properties/version
        imports/cvss/cvss-v3.1.json#/properties/version
        imports/cvss/cvss-v4.0.json#/properties/version
  vectorString:
    description: The scores' metric values written as one compact string.
    required: true
    close_mappings:
      - sepses_cvss:vectorString
      - spdx_security:vectorString
    annotations:
      upstream_path: >-
        imports/cvss/cvss-v2.0.json#/properties/vectorString
        imports/cvss/cvss-v3.0.json#/properties/vectorString
        imports/cvss/cvss-v3.1.json#/properties/vectorString
        imports/cvss/cvss-v4.0.json#/properties/vectorString
  baseScore:
    description: The score from 0 to 10 for what is inherent in the flaw.
    range: float
    required: true
    minimum_value: 0
    maximum_value: 10
    close_mappings:
      - sepses_cvss:baseScore
      - spdx_security:score
    annotations:
      upstream_path: >-
        imports/cvss/cvss-v2.0.json#/definitions/scoreType
        imports/cvss/cvss-v3.0.json#/definitions/scoreType
        imports/cvss/cvss-v3.1.json#/definitions/scoreType
        imports/cvss/cvss-v4.0.json#/definitions/scoreType
  baseSeverity:
    description: The rating in words that the base score falls under.
    range: CvssSeverity
    required: true
    close_mappings:
      - sepses_cvss:baseSeverity
      - spdx_security:severity
    annotations:
      upstream_path: >-
        imports/cvss/cvss-v3.0.json#/properties/baseSeverity
        imports/cvss/cvss-v3.1.json#/properties/baseSeverity
        imports/cvss/cvss-v4.0.json#/properties/baseSeverity
  temporalScore:
    description: The base score adjusted for what changes over time, such as a fix appearing.
    range: float
    minimum_value: 0
    maximum_value: 10
    annotations:
      upstream_path: >-
        imports/cvss/cvss-v2.0.json#/properties/temporalScore
