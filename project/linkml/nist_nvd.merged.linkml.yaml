      "rules": [
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "NONE"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 0,
                "maximum_value": 0
              }
            }
          },
          "description": "A base severity of NONE goes with a base score of exactly 0.",
          "title": "base severity NONE"
        },
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "LOW"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 0.1,
                "maximum_value": 3.9
              }
            }
          },
          "description": "A base severity of LOW goes with a base score from 0.1 to 3.9.",
          "title": "base severity LOW"
        },
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "MEDIUM"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 4.0,
                "maximum_value": 6.9
              }
            }
          },
          "description": "A base severity of MEDIUM goes with a base score from 4.0 to 6.9.",
          "title": "base severity MEDIUM"
        },
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "HIGH"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 7.0,
                "maximum_value": 8.9
              }
            }
          },
          "description": "A base severity of HIGH goes with a base score from 7.0 to 8.9.",
          "title": "base severity HIGH"
        },
        {
          "preconditions": {
            "slot_conditions": {
              "baseSeverity": {
                "name": "baseSeverity",
                "equals_string": "CRITICAL"
              }
            }
          },
          "postconditions": {
            "slot_conditions": {
              "baseScore": {
                "name": "baseScore",
                "minimum_value": 9.0,
                "maximum_value": 10.0
              }
            }
          },
          "description": "A base severity of CRITICAL goes with a base score from 9.0 to 10.",
          "title": "base severity CRITICAL"
        }
      ]
